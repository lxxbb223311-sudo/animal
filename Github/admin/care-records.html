<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健康档案 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -webkit-tap-highlight-color: transparent; }

        /* --- 原生 SPA 级页面推拉动效 --- */
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slideOutLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-30%); opacity: 0.5; } }
        @keyframes slideInLeft { from { transform: translateX(-30%); opacity: 0.5; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); } to { transform: translateX(100%); } }

        /* 动画类名绑定 */
        .page-enter-right { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-left { animation: slideOutLeft 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-enter-left { animation: slideInLeft 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-right { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 selection:bg-[#4FBFFF] selection:text-white">

    <main id="care-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col bg-[#E6F2FF] overflow-hidden shadow-2xl">

        <header class="flex items-center justify-between px-6 pt-10 pb-3 shrink-0 z-20">
            <button onclick="handleBackToDashboard()" class="w-9 h-9 flex items-center justify-center -ml-2 active:scale-90 transition-transform">
                <svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1 class="text-[17px] font-bold text-gray-900 tracking-wider">健康档案</h1>
            <button class="w-9 h-9 flex items-center justify-center -mr-2 active:scale-90 transition-transform text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
        </header>

        <div id="cat-list-container" class="flex-1 overflow-y-auto px-5 pt-3 pb-12 flex flex-col gap-4">
            </div>

    </main>

    <script>
        // 1. 初始化数据与渲染
        document.addEventListener('DOMContentLoaded', () => {
            // 处理进场动画：如果是从更新页返回，则从左侧推入；否则默认从右侧推入
            const urlParams = new URLSearchParams(window.location.search);
            const main = document.getElementById('care-main');
            if (urlParams.get('from') === 'update') {
                main.classList.add('page-enter-left');
                window.history.replaceState(null, '', window.location.pathname);
            } else {
                main.classList.add('page-enter-right');
            }

            // 初始化 Mock 数据
            let cats = JSON.parse(localStorage.getItem('care_cats'));
            if (!cats || cats.length === 0) {
                cats = [
                    { id: 1, name: "小橘", age: "3岁 女", img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=200&auto=format&fit=crop", deworm: "已驱虫", dTime: "1天前", bath: "已洗澡", bTime: "1天前" },
                    { id: 2, name: "小黑", age: "2岁 男", img: "https://images.unsplash.com/photo-1573865526739-10659fec78a5?q=80&w=200&auto=format&fit=crop", deworm: "已驱虫", dTime: "3天前", bath: "未洗澡", bTime: "一个月前" },
                    { id: 3, name: "可乐", age: "3岁 女", img: "https://images.unsplash.com/photo-1543852786-1cf6624b9987?q=80&w=200&auto=format&fit=crop", deworm: "未驱虫", dTime: "一个月前", bath: "已洗澡", bTime: "1天前" },
                    { id: 4, name: "芝麻", age: "1岁 男", img: "https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?q=80&w=200&auto=format&fit=crop", deworm: "已驱虫", dTime: "1天前", bath: "已洗澡", bTime: "1天前" }
                ];
                localStorage.setItem('care_cats', JSON.stringify(cats));
            }

            // 渲染列表
            renderList(cats);
        });

        // 2. 渲染核心函数
        function renderList(cats) {
            const container = document.getElementById('cat-list-container');
            let html = '';

            cats.forEach(cat => {
                // 动态判断颜色标签
                const dColor = cat.deworm === '已驱虫' ? 'bg-[#4FBFFF]/10 text-[#4FBFFF]' : 'bg-red-50 text-red-400';
                const bColor = cat.bath === '已洗澡' ? 'bg-[#4FBFFF]/10 text-[#4FBFFF]' : 'bg-red-50 text-red-400';

                html += `
                <div onclick="goToUpdate(${cat.id})" class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm active:scale-[0.98] transition-transform cursor-pointer border border-white">
                    <div class="flex items-center gap-3">
                        <img class="w-[52px] h-[52px] rounded-full border-[2.5px] border-[#E6F2FF] object-cover shadow-sm" src="${cat.img}" alt="${cat.name}" />
                        <div class="flex flex-col justify-center">
                            <span class="text-[15px] font-bold text-gray-900">${cat.name}</span>
                            <span class="text-[12px] text-gray-400 mt-0.5 tracking-wide">${cat.age}</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-2">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-gray-400">${cat.dTime}</span>
                            <span class="w-[52px] text-center py-1 rounded-[6px] ${dColor} text-[11px] font-bold">${cat.deworm}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-gray-400">${cat.bTime}</span>
                            <span class="w-[52px] text-center py-1 rounded-[6px] ${bColor} text-[11px] font-bold">${cat.bath}</span>
                        </div>
                    </div>
                </div>`;
            });

            html += `<div class="mt-4 pb-8 text-center"><span class="text-[12px] text-gray-400">没有更多数据了</span></div>`;
            container.innerHTML = html;
        }

        // 3. 点击卡片：向左推出版面，跳转更新页
        function goToUpdate(id) {
            const main = document.getElementById('care-main');
            main.classList.add('page-leave-left');
            setTimeout(() => {
                window.location.href = `update-care.html?id=${id}`;
            }, 300);
        }

        // 4. 返回 Dashboard
        function handleBackToDashboard() {
            const main = document.getElementById('care-main');
            main.classList.add('page-leave-right');
            setTimeout(() => {
                window.location.href = 'dashboard.html?from=care';
            }, 300);
        }
    </script>
</body>
</html>
