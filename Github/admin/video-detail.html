<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>视频详情 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隐藏原生滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { -webkit-tap-highlight-color: transparent; }

        /* --- 原生 SPA 级页面推拉动效 --- */
        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); }
            to { transform: translateX(100%); }
        }
        .page-enter-right {
            animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .page-leave-right {
            animation: slideOutRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 selection:bg-[#4FBFFF] selection:text-white">

    <main id="detail-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col bg-[#E6F2FF] overflow-hidden shadow-2xl page-enter-right">

        <header class="flex items-center justify-between px-6 pt-10 pb-3 shrink-0 z-20">
            <button onclick="handleClose()" class="w-9 h-9 flex items-center justify-center -ml-2 active:scale-90 transition-transform">
                <svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1 class="text-[17px] font-bold text-gray-900 tracking-wider">视频</h1>
            <div class="w-9 h-9"></div> </header>

        <div class="mx-6 mt-2 shrink-0 rounded-[20px] overflow-hidden bg-white shadow-md relative flex flex-col z-20">
            
            <div class="relative w-full h-[220px] bg-black">
                <video src="assets/video/cat_sample.mp4" 
                       poster="https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?q=80&w=800&auto=format&fit=crop" 
                       muted autoplay loop playsinline 
                       class="w-full h-full object-cover opacity-95">
                </video>
                
                <div class="absolute top-3 left-3 bg-white/20 backdrop-blur-sm text-white/90 text-[11px] font-medium px-2.5 py-0.5 rounded shadow-sm tracking-wide">
                    2026-04-06 10:35:07
                </div>
                <div class="absolute bottom-3 left-3 bg-black/40 backdrop-blur-md text-white/90 text-[11px] px-3 py-1 rounded-full flex items-center gap-1 shadow-sm">
                    <span class="relative flex h-2 w-2 mr-0.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#EFCC4D] opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-[#EFCC4D]"></span>
                    </span>
                    2人在看
                </div>
                <button class="absolute bottom-3 right-3 text-white/90 active:scale-90 transition-transform drop-shadow-md">
                    <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </button>
            </div>

            <div class="bg-gradient-to-r from-[#FFE5B4] to-[#FFD180] px-4 py-3 flex justify-between items-center text-[#90721B] text-[12px] font-bold">
                <div class="flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4a1 1 0 00-1 1v2a4 4 0 004 4h10a4 4 0 004-4v-2a1 1 0 00-1-1zM16 12V8a4 4 0 00-8 0v4"></path></svg>
                    今日投喂 <span>2000g</span>
                </div>
                <div class="flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    今日 6人参与
                </div>
            </div>
        </div>

        <div class="flex-1 bg-white mx-6 mt-4 mb-24 rounded-[20px] shadow-sm flex flex-col overflow-hidden relative z-10">
            <div class="flex relative border-b border-gray-100 shrink-0">
                <button onclick="switchTab(0)" id="tab-btn-0" class="flex-1 py-3.5 text-[15px] font-bold text-gray-900 transition-colors">参与名单</button>
                <button onclick="switchTab(1)" id="tab-btn-1" class="flex-1 py-3.5 text-[15px] font-medium text-gray-400 transition-colors">退款明细</button>
                
                <div id="tab-indicator" class="absolute bottom-0 left-0 w-1/2 h-[3px] flex justify-center transition-transform duration-300 cubic-bezier(0.4, 0, 0.2, 1)">
                    <div class="w-16 h-full bg-[#EFCC4D] rounded-t-md"></div>
                </div>
            </div>

            <div class="flex-1 relative overflow-hidden">
                <div id="tab-content-slider" class="flex w-[200%] h-full transition-transform duration-300 ease-in-out">
                    
                    <div class="w-1/2 h-full overflow-y-auto no-scrollbar px-5 pt-3 pb-6 flex flex-col">
                        <div class="flex items-center justify-between py-2.5">
                            <div class="flex items-center gap-2">
                                <span class="text-lg">😀</span>
                                <span class="text-[14px] text-gray-800 font-bold tracking-wide">喵星人</span>
                                <span class="text-[11px] text-gray-400 ml-1 font-medium tracking-wide">2026.04.06</span>
                            </div>
                            <span class="text-[13px] text-[#4FBFFF] font-bold">支持50元</span>
                        </div>
                        <div class="flex items-center justify-between py-2.5">
                            <div class="flex items-center gap-2">
                                <span class="text-lg">😀</span>
                                <span class="text-[14px] text-gray-800 font-bold tracking-wide">喵星人</span>
                                <span class="text-[11px] text-gray-400 ml-1 font-medium tracking-wide">2026.04.06</span>
                            </div>
                            <span class="text-[13px] text-[#4FBFFF] font-bold">支持50元</span>
                        </div>
                        <div class="flex items-center justify-between py-2.5">
                            <div class="flex items-center gap-2">
                                <span class="text-lg">😀</span>
                                <span class="text-[14px] text-gray-800 font-bold tracking-wide">喵星人</span>
                                <span class="text-[11px] text-gray-400 ml-1 font-medium tracking-wide">2026.04.06</span>
                            </div>
                            <span class="text-[13px] text-[#4FBFFF] font-bold">支持50元</span>
                        </div>
                    </div>

                    <div class="w-1/2 h-full overflow-y-auto no-scrollbar px-5 pt-3 pb-6 flex flex-col">
                        <div class="flex items-center justify-between py-3 border-b border-gray-50 last:border-0">
                            <div class="flex flex-col gap-1">
                                <span class="text-[14px] text-gray-800 font-bold tracking-wide">退款成功</span>
                                <span class="text-[11px] text-gray-400 font-medium">2026.04.05 18:22 · 原路退回</span>
                            </div>
                            <span class="text-[15px] text-gray-900 font-bold">-20.00</span>
                        </div>
                        <div class="flex items-center justify-between py-3 border-b border-gray-50 last:border-0">
                            <div class="flex flex-col gap-1">
                                <span class="text-[14px] text-gray-800 font-bold tracking-wide">退款成功</span>
                                <span class="text-[11px] text-gray-400 font-medium">2026.04.02 09:15 · 原路退回</span>
                            </div>
                            <span class="text-[15px] text-gray-900 font-bold">-15.00</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="absolute bottom-8 left-0 w-full px-6 z-30">
            <button onclick="handleClose()" class="w-full bg-white hover:bg-gray-50 active:scale-[0.98] transition-transform text-gray-700 py-[14px] rounded-[20px] text-[16px] font-bold tracking-widest shadow-md">
                关闭
            </button>
        </div>

    </main>

    <script>
        function switchTab(index) {
            const btn0 = document.getElementById('tab-btn-0');
            const btn1 = document.getElementById('tab-btn-1');
            const indicator = document.getElementById('tab-indicator');
            const slider = document.getElementById('tab-content-slider');

            if (index === 0) {
                btn0.classList.replace('text-gray-400', 'text-gray-900');
                btn0.classList.replace('font-medium', 'font-bold');
                btn1.classList.replace('text-gray-900', 'text-gray-400');
                btn1.classList.replace('font-bold', 'font-medium');
                indicator.style.transform = 'translateX(0%)';
                slider.style.transform = 'translateX(0%)';
            } else {
                btn1.classList.replace('text-gray-400', 'text-gray-900');
                btn1.classList.replace('font-medium', 'font-bold');
                btn0.classList.replace('text-gray-900', 'text-gray-400');
                btn0.classList.replace('font-bold', 'font-medium');
                indicator.style.transform = 'translateX(100%)';
                slider.style.transform = 'translateX(-50%)';
            }
        }

        // 丝滑退出：向右滑出并传参给首页触发左侧拉回
        function handleClose() {
            const main = document.getElementById('detail-main');
            main.classList.remove('page-enter-right');
            main.classList.add('page-leave-right');
            setTimeout(() => {
                // 携带参数返回，让 Dashboard 知道是推页返回的
                window.location.href = 'dashboard.html?from=detail';
            }, 300);
        }
    </script>
</body>
</html>
