<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>喵咪列表 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -webkit-tap-highlight-color: transparent; }
        
        /* 页面切换动画 */
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slideOutRight { from { transform: translateX(0); } to { transform: translateX(100%); } }
        @keyframes slideInLeft { from { transform: translateX(-30%); opacity: 0.5; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-30%); opacity: 0.5; } }
        
        .page-enter-right { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-right { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-enter-left { animation: slideInLeft 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-left { animation: slideOutLeft 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 列表项交错向上浮现动画 */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up-item {
            opacity: 0;
            animation: fadeUp 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 刚添加的新成员专属高亮呼吸动画 */
        @keyframes highlightNew {
            0% { background-color: #FFFBEB; box-shadow: 0 0 20px rgba(241, 200, 75, 0.4); transform: scale(0.98); }
            50% { background-color: #FEF3C7; box-shadow: 0 0 25px rgba(241, 200, 75, 0.6); transform: scale(1.02); }
            100% { background-color: #ffffff; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); transform: scale(1); }
        }
        .highlight-new {
            animation: highlightNew 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 selection:bg-[#4FBFFF] selection:text-white relative">

    <main id="add-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col bg-[#E6F2FF] overflow-hidden shadow-2xl">

        <header class="flex items-center justify-between px-6 pt-10 pb-3 shrink-0 z-20">
            <button onclick="handleBack()" class="w-9 h-9 flex items-center justify-center -ml-2 active:scale-90 transition-transform">
                <svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1 class="text-[17px] font-bold text-gray-900 tracking-wider">添加喵咪</h1>
            <div class="w-9 h-9"></div> 
        </header>

        <div id="cat-list-container" class="flex-1 overflow-y-auto px-5 pt-3 pb-24 flex flex-col gap-4">
            </div>

        <div class="absolute bottom-8 left-0 w-full px-6 z-30">
            <button onclick="goToCreateCat()" class="w-full bg-[#4FBFFF] hover:bg-[#3daeee] active:scale-[0.98] transition-transform text-white py-[14px] rounded-[16px] text-[16px] font-bold tracking-widest shadow-lg shadow-[#4FBFFF]/30">
                添加喵咪
            </button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isRefresh = urlParams.get('refresh') === '1';
            const main = document.getElementById('add-main');
            
            // 判断进场方向：从新建页返回从左侧拉回，否则右侧进入
            if (isRefresh) {
                main.classList.add('page-enter-left');
                window.history.replaceState(null, '', window.location.pathname);
            } else {
                main.classList.add('page-enter-right');
            }

            // 初始化与获取 LocalStorage 数据
            let cats = JSON.parse(localStorage.getItem('cat_list'));
            if (!cats || cats.length === 0) {
                // 预设图二数据
                cats = [
                    { name: "小橘", age: "3岁", desc: "橘猫/吃货/已绝育", img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=200&auto=format&fit=crop" },
                    { name: "芝麻糊", age: "3岁", desc: "英短/安静/已绝育", img: "https://images.unsplash.com/photo-1573865526739-10659fec78a5?q=80&w=200&auto=format&fit=crop" },
                    { name: "黑煤球", age: "2岁", desc: "黑猫/活泼/未绝育", img: "https://images.unsplash.com/photo-1495360010541-f48722b34f7d?q=80&w=200&auto=format&fit=crop" }
                ];
                localStorage.setItem('cat_list', JSON.stringify(cats));
            }
            
            renderList(cats, isRefresh);
        });

        // 渲染列表：isRefresh=true 时，第一条数据高亮
        function renderList(cats, isRefresh) {
            const container = document.getElementById('cat-list-container');
            let html = '';

            // 空状态 UI 处理
            if (cats.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 gap-3 opacity-60">
                        <svg class="w-16 h-16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>
                        <span class="text-[14px]">暂无猫咪，快去添加吧</span>
                    </div>`;
                return;
            }

            cats.forEach((cat, index) => {
                const delay = index * 0.08; 
                // 若是从新增页返回，且是第一条数据，赋予高亮特效类名
                const extraClass = (isRefresh && index === 0) ? 'highlight-new' : 'bg-white';
                
                html += `
                <div class="fade-up-item ${extraClass} rounded-[18px] p-4 flex items-center justify-between shadow-sm active:scale-[0.98] transition-transform cursor-pointer border border-transparent" style="animation-delay: ${delay}s">
                    <div class="flex items-center gap-4">
                        <img class="w-[52px] h-[52px] rounded-full object-cover shadow-sm border border-gray-100" src="${cat.img}" alt="${cat.name}" />
                        <div class="flex flex-col justify-center">
                            <div class="flex items-center gap-2">
                                <span class="text-[16px] font-bold text-gray-900">${cat.name}</span>
                                <span class="bg-[#4FBFFF]/10 text-[#4FBFFF] text-[10px] font-bold px-2 py-[2px] rounded-full">${cat.age}</span>
                            </div>
                            <span class="text-[12px] text-gray-400 mt-1 tracking-wide line-clamp-1">${cat.desc}</span>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                </div>`;
            });
            container.innerHTML = html;
        }

        // 跳转至新增页：当前页向左滑出
        function goToCreateCat() {
            const main = document.getElementById('add-main');
            main.classList.remove('page-enter-left', 'page-enter-right');
            main.classList.add('page-leave-left');
            setTimeout(() => {
                window.location.href = 'create-cat.html';
            }, 300);
        }

        // 丝滑返回 Dashboard
        function handleBack() {
            const main = document.getElementById('add-main');
            main.classList.remove('page-enter-left', 'page-enter-right');
            main.classList.add('page-leave-right');
            setTimeout(() => {
                window.location.href = 'dashboard.html?from=newMember';
            }, 300);
        }
    </script>
</body>
</html>
