<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>状态更新 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -webkit-tap-highlight-color: transparent; }

        /* 动画设定 */
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slideOutRight { from { transform: translateX(0); } to { transform: translateX(100%); } }
        
        .page-enter-right { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-right { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* Toast 动画 */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, 20px) scale(0.9); }
            15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            85% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -20px) scale(0.9); }
        }
        .toast-anim { animation: fadeInOut 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 selection:bg-[#4FBFFF] selection:text-white relative">

    <main id="update-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col bg-[#E6F2FF] overflow-hidden shadow-2xl page-enter-right">

        <header class="flex items-center justify-between px-6 pt-10 pb-3 shrink-0 z-20">
            <button onclick="handleCancel()" class="w-9 h-9 flex items-center justify-center -ml-2 active:scale-90 transition-transform">
                <svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1 class="text-[17px] font-bold text-gray-900 tracking-wider">状态更新</h1>
            <div class="w-9 h-9"></div>
        </header>

        <div class="mx-6 mt-2 shrink-0 rounded-[20px] overflow-hidden bg-white shadow-md relative flex flex-col z-20 border border-white">
            <div class="relative w-full h-[240px] bg-gray-100">
                <img id="cat-img" src="" alt="Cat" class="w-full h-full object-cover">
                <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/70 to-transparent"></div>
                <div class="absolute bottom-4 left-5 text-white">
                    <h2 id="cat-name" class="text-2xl font-bold tracking-wide">加载中...</h2>
                    <p id="cat-age" class="text-[13px] text-white/80 mt-1"></p>
                </div>
            </div>

            <div class="bg-white p-5 flex flex-col gap-4">
                
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center text-[12px] font-bold text-gray-700">
                        <div class="flex items-center gap-1.5">
                            <span class="text-lg">💊</span> 当前驱虫状态
                        </div>
                        <span id="deworm-status-text" class="text-[#FFCC4D]">加载中</span>
                    </div>
                    <div class="w-full bg-gray-100 h-2.5 rounded-full overflow-hidden">
                        <div id="deworm-bar" class="h-full bg-gradient-to-r from-[#FFE5B4] to-[#FFCC4D] rounded-full transition-all duration-500 w-0"></div>
                    </div>
                    <div class="text-[10px] text-gray-400 text-right mt-0.5" id="deworm-time-text"></div>
                </div>

                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center text-[12px] font-bold text-gray-700">
                        <div class="flex items-center gap-1.5">
                            <span class="text-lg">🛁</span> 当前洗澡状态
                        </div>
                        <span id="bath-status-text" class="text-[#4FBFFF]">加载中</span>
                    </div>
                    <div class="w-full bg-gray-100 h-2.5 rounded-full overflow-hidden">
                        <div id="bath-bar" class="h-full bg-gradient-to-r from-[#E1F5FE] to-[#4FBFFF] rounded-full transition-all duration-500 w-0"></div>
                    </div>
                    <div class="text-[10px] text-gray-400 text-right mt-0.5" id="bath-time-text"></div>
                </div>

            </div>
        </div>

        <div class="px-6 mt-8 flex flex-col gap-4 z-20">
            <button onclick="completeAction('deworm')" class="w-full bg-white/60 hover:bg-white active:scale-[0.97] backdrop-blur-md border border-white transition-all text-[#D6A000] py-[15px] rounded-[18px] text-[16px] font-bold tracking-widest shadow-sm flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                完成本次驱虫
            </button>
            
            <button onclick="completeAction('bath')" class="w-full bg-white/60 hover:bg-white active:scale-[0.97] backdrop-blur-md border border-white transition-all text-[#288ED7] py-[15px] rounded-[18px] text-[16px] font-bold tracking-widest shadow-sm flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                完成本次洗澡
            </button>
        </div>

        <div class="absolute bottom-8 left-0 w-full px-6 z-30">
            <button onclick="handleCancel()" class="w-full bg-white/50 active:bg-white/80 transition-colors text-gray-500 py-3 rounded-[20px] text-[15px] font-medium tracking-widest shadow-sm border border-white/50">
                取消返回
            </button>
        </div>

        <div id="toast" class="fixed top-1/3 left-1/2 hidden z-50 pointer-events-none">
            <div class="bg-gray-900/80 backdrop-blur-md text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-2 font-medium">
                <svg class="w-5 h-5 text-[#4FBFFF]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                更新成功！
            </div>
        </div>

    </main>

    <script>
        let currentId = null;
        let catsData = [];

        // 1. 初始化读取数据
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentId = parseInt(urlParams.get('id'));
            catsData = JSON.parse(localStorage.getItem('care_cats')) || [];
            
            const cat = catsData.find(c => c.id === currentId);
            if(cat) {
                // 渲染基础信息
                document.getElementById('cat-img').src = cat.img;
                document.getElementById('cat-name').textContent = cat.name;
                document.getElementById('cat-age').textContent = cat.age;

                // 渲染状态条
                updateUIStatus(cat);
            } else {
                alert('未找到该猫咪数据！');
                handleCancel();
            }
        });

        // 更新状态 UI 显示逻辑
        function updateUIStatus(cat) {
            const isDewormed = cat.deworm === '已驱虫';
            const isBathed = cat.bath === '已洗澡';

            document.getElementById('deworm-status-text').textContent = cat.deworm;
            document.getElementById('deworm-status-text').className = isDewormed ? 'text-[#FFCC4D]' : 'text-red-400';
            document.getElementById('deworm-bar').style.width = isDewormed ? '100%' : '20%';
            document.getElementById('deworm-time-text').textContent = "记录时间: " + cat.dTime;

            document.getElementById('bath-status-text').textContent = cat.bath;
            document.getElementById('bath-status-text').className = isBathed ? 'text-[#4FBFFF]' : 'text-red-400';
            document.getElementById('bath-bar').style.width = isBathed ? '100%' : '20%';
            document.getElementById('bath-time-text').textContent = "记录时间: " + cat.bTime;
        }

        // 2. 点击更新操作
        function completeAction(type) {
            const catIndex = catsData.findIndex(c => c.id === currentId);
            if (catIndex === -1) return;

            if (type === 'deworm') {
                catsData[catIndex].deworm = '已驱虫';
                catsData[catIndex].dTime = '刚刚';
            } else {
                catsData[catIndex].bath = '已洗澡';
                catsData[catIndex].bTime = '刚刚';
            }

            // 保存到本地
            localStorage.setItem('care_cats', JSON.stringify(catsData));
            
            // UI 即时反馈
            updateUIStatus(catsData[catIndex]);

            // 显示 Toast 并自动返回
            showToast();
            setTimeout(() => {
                handleCancel();
            }, 1200);
        }

        // 3. Toast 提示
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            toast.classList.add('toast-anim');
            // 动画结束后重置
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-anim');
            }, 1500);
        }

        // 4. 取消并返回列表
        function handleCancel() {
            const main = document.getElementById('update-main');
            main.classList.remove('page-enter-right');
            main.classList.add('page-leave-right'); // 右滑退出
            setTimeout(() => {
                // 传参通知列表页执行左进动画
                window.location.href = 'care-records.html?from=update';
            }, 300);
        }
    </script>
</body>
</html>
