<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>添加猫咪 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -webkit-tap-highlight-color: transparent; }
        
        /* 页面切换动画 */
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slideOutRight { from { transform: translateX(0); } to { transform: translateX(100%); } }
        .page-enter-right { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-right { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* Toast 动画 */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, 20px) scale(0.9); }
            15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            85% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -20px) scale(0.9); }
        }
        .toast-anim { animation: fadeInOut 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 selection:bg-[#F1C84B] selection:text-white relative">

    <main id="create-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col bg-[#E6F2FF] overflow-hidden shadow-2xl page-enter-right">

        <header class="flex items-center justify-between px-6 pt-10 pb-3 shrink-0 z-30 sticky top-0 bg-[#E6F2FF]/95 backdrop-blur-sm">
            <button onclick="handleBack()" class="w-9 h-9 flex items-center justify-center -ml-2 active:scale-90 transition-transform">
                <svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1 class="text-[17px] font-bold text-gray-900 tracking-wider">添加喵咪</h1>
            <button onclick="saveCat()" class="text-[#F1C84B] font-bold text-[15px] active:opacity-60 transition-opacity z-30 relative">
                保存
            </button>
        </header>

        <div class="px-6 py-2 flex flex-col overflow-y-auto pb-24 relative z-10">
            
            <div class="relative flex items-center justify-between py-[18px] border-b border-black/5 active:bg-black/5 transition-colors rounded-lg">
                <span class="text-[15px] font-medium text-gray-800">头像</span>
                <div class="w-[46px] h-[46px] rounded-full bg-black/10 flex items-center justify-center overflow-hidden border-2 border-[#E6F2FF] shadow-sm pointer-events-none">
                    <svg id="default-paw" class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 8c-1.6 0-3-1.4-3-3s1.4-3 3-3 3 1.4 3 3-1.4 3-3 3zm-5.5 3c-1.4 0-2.5-1.1-2.5-2.5S5.1 6 6.5 6 9 7.1 9 8.5 7.9 11 6.5 11zm11 0c-1.4 0-2.5-1.1-2.5-2.5S16.1 6 17.5 6 20 7.1 20 8.5 18.9 11 17.5 11zm-5.5 12c-4 0-6.5-2.5-7.5-4.5-.5-1-.2-2.5.5-3.5 1-1.4 2.5-1.5 4-1 1 .3 2 .5 3 .5s2-.2 3-.5c1.5-.5 3-.4 4 1 .8 1 1 2.5.5 3.5-1 2-3.5 4.5-7.5 4.5z"/>
                    </svg>
                    <img id="preview-img" src="" class="w-full h-full object-cover hidden" alt="Avatar">
                </div>
                <input type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="previewAvatar(event)">
            </div>

            <div class="flex items-center justify-between py-[18px] border-b border-black/5 relative z-20">
                <span class="text-[15px] font-medium text-gray-800">昵称</span>
                <input type="text" id="cat-name" placeholder="请输入昵称" class="flex-1 ml-4 bg-transparent outline-none text-right text-[15px] text-gray-900 placeholder-gray-400 font-medium">
            </div>

            <div class="relative flex items-center justify-between py-[18px] border-b border-black/5 active:bg-black/5 transition-colors rounded-lg">
                <span class="text-[15px] font-medium text-gray-800">年龄</span>
                <div class="flex items-center gap-1.5 pointer-events-none">
                    <span id="display-date" class="text-[14px] text-gray-400">请选择出生日期</span>
                    <svg class="w-[14px] h-[14px] text-gray-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                </div>
                <input type="date" id="cat-date" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20 block" onchange="updateVal('cat-date', 'display-date')" onclick="try{this.showPicker()}catch(e){}">
            </div>

            <div class="relative flex items-center justify-between py-[18px] border-b border-black/5 active:bg-black/5 transition-colors rounded-lg">
                <span class="text-[15px] font-medium text-gray-800">性别</span>
                <div class="flex items-center gap-1.5 pointer-events-none">
                    <span id="display-gender" class="text-[14px] text-gray-400">请选择性别</span>
                    <svg class="w-[14px] h-[14px] text-gray-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                </div>
                <select id="cat-gender" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20 block" onchange="updateVal('cat-gender', 'display-gender')">
                    <option value="" disabled selected>请选择性别</option>
                    <option value="男孩">男孩</option>
                    <option value="女孩">女孩</option>
                    <option value="未知">未知</option>
                </select>
            </div>

            <div class="relative flex items-center justify-between py-[18px] border-b border-black/5 active:bg-black/5 transition-colors rounded-lg">
                <span class="text-[15px] font-medium text-gray-800">绝育情况</span>
                <div class="flex items-center gap-1.5 pointer-events-none">
                    <span id="display-neuter" class="text-[14px] text-gray-400">请选择</span>
                    <svg class="w-[14px] h-[14px] text-gray-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                </div>
                <select id="cat-neuter" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20 block" onchange="updateVal('cat-neuter', 'display-neuter')">
                    <option value="" disabled selected>请选择</option>
                    <option value="已绝育">已绝育</option>
                    <option value="未绝育">未绝育</option>
                    <option value="未知">未知</option>
                </select>
            </div>

            <div class="relative flex items-center justify-between py-[18px] border-b border-black/5 active:bg-black/5 transition-colors rounded-lg">
                <span class="text-[15px] font-medium text-gray-800">驱虫情况</span>
                <div class="flex items-center gap-1.5 pointer-events-none">
                    <span id="display-deworm" class="text-[14px] text-gray-400">请选择</span>
                    <svg class="w-[14px] h-[14px] text-gray-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                </div>
                <select id="cat-deworm" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20 block" onchange="updateVal('cat-deworm', 'display-deworm')">
                    <option value="" disabled selected>请选择</option>
                    <option value="已驱虫">已驱虫</option>
                    <option value="未驱虫">未驱虫</option>
                </select>
            </div>

        </div>

        <div id="toast" class="fixed top-1/3 left-1/2 hidden z-50 pointer-events-none w-max max-w-[80%]">
            <div class="bg-gray-900/85 backdrop-blur-md text-white px-7 py-3.5 rounded-[18px] shadow-xl flex items-center gap-2 font-medium tracking-wide">
                <svg class="w-5 h-5 text-[#F1C84B]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                保存成功
            </div>
        </div>

    </main>

    <script>
        let base64Avatar = "";

        // 1. 带前端 Canvas 压缩的图片上传预览（防止 LocalStorage 5MB 溢出）
        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        // 强制缩小分辨率
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 300; // 降低分辨率至安全范围
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        // 压缩为 jpeg 格式，质量0.7
                        base64Avatar = canvas.toDataURL('image/jpeg', 0.7);
                        
                        document.getElementById('preview-img').src = base64Avatar;
                        document.getElementById('preview-img').classList.remove('hidden');
                        document.getElementById('default-paw').classList.add('hidden');
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // 2. 捕获底层原生选择器的数据并渲染到右侧
        function updateVal(inputId, displayId) {
            const input = document.getElementById(inputId);
            const display = document.getElementById(displayId);
            if (input.value) {
                display.textContent = input.value;
                display.classList.remove('text-gray-400');
                display.classList.add('text-gray-900', 'font-medium');
            }
        }

        // 3. 核心打包保存逻辑
        function saveCat() {
            const name = document.getElementById('cat-name').value.trim();
            const date = document.getElementById('cat-date').value;
            const gender = document.getElementById('cat-gender').value;
            const neuter = document.getElementById('cat-neuter').value;
            const deworm = document.getElementById('cat-deworm').value;
            
            // 基础校验
            if (!name) {
                alert('别忘了给小猫起个昵称哦~');
                return;
            }

            // 智能计算年龄
            let finalAge = "几个月";
            if (date) {
                const birthYear = new Date(date).getFullYear();
                const nowYear = new Date().getFullYear();
                const diff = nowYear - birthYear;
                finalAge = diff > 0 ? diff + "岁" : "几个月";
            }

            // 组合底部浅色描述信息
            const finalDesc = (gender || "未知") + " / " + (neuter || "未知") + " / " + (deworm || "未知");
            
            // 默认网图占位
            const finalImg = base64Avatar || "https://images.unsplash.com/photo-1543852786-1cf6624b9987?q=80&w=200&auto=format&fit=crop";

            const newCatData = {
                name: name,
                age: finalAge,
                desc: finalDesc,
                img: finalImg
            };

            // 保存到 LocalStorage，插入到数组头部
            let cats = JSON.parse(localStorage.getItem('cat_list')) || [];
            cats.unshift(newCatData);
            
            try {
                localStorage.setItem('cat_list', JSON.stringify(cats));
            } catch (e) {
                alert('存储空间不足，请清理浏览器缓存！');
                return;
            }

            // 显示 Toast 提示，随后丝滑返回带 refresh 参数
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            toast.classList.add('toast-anim');
            
            setTimeout(() => {
                handleBack(true);
            }, 800);
        }

        // 4. 返回列表页
        function handleBack(isSaved = false) {
            const main = document.getElementById('create-main');
            main.classList.remove('page-enter-right');
            main.classList.add('page-leave-right'); // 退出永远是向右滑出
            setTimeout(() => {
                window.location.href = isSaved ? 'add-cat.html?refresh=1' : 'add-cat.html';
            }, 300);
        }
    </script>
</body>
</html>
