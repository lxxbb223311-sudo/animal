<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理员登录 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 0.5; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .page-enter {
            animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .page-leave {
            animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        input {
            -webkit-tap-highlight-color: transparent;
        }
        input:focus {
            outline: none;
        }
        input::placeholder {
            color: #C0C4CC;
            font-weight: normal;
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased overflow-hidden selection:bg-[#F1C84B] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col px-8 page-enter bg-[#E6F2FF]">

        <header class="pt-14 pb-2 flex-shrink-0">
            <button onclick="handleBack()" class="p-2 -ml-2 transition-transform active:scale-90 text-gray-900">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
        </header>

        <div class="flex-1 flex flex-col pt-6 pb-28 justify-center relative z-10">
            <h1 class="text-[26px] font-bold text-gray-900 mb-12 tracking-wide">
                管理员登录
            </h1>

            <div class="flex flex-col gap-8 w-full">
                <div class="border-b border-[#D6DCE5] focus-within:border-gray-500 transition-colors pb-3 flex items-center">
                    <input type="text" id="login-username" placeholder="请输入账号/用户名" class="w-full bg-transparent text-[16px] text-gray-900 font-medium" />
                </div>

                <div class="border-b border-[#D6DCE5] focus-within:border-gray-500 transition-colors pb-3 flex justify-between items-center">
                    <input type="password" id="login-password" placeholder="请输入密码" class="w-full bg-transparent text-[16px] text-gray-900 font-medium" />
                </div>
            </div>

            <button onclick="handleLogin()" class="w-full bg-[#EFCC4D] hover:bg-[#e4c247] mt-12 py-[14px] rounded-full text-[17px] font-bold tracking-widest shadow-sm transition-transform duration-200 active:scale-95 flex items-center justify-center text-[#90721B]">
                登录
            </button>

            
        </div>

        <footer class="absolute bottom-10 left-0 w-full flex flex-col items-center">
            <span class="text-[12px] text-[#A0A8B6] mb-5">其他登录方式</span>
            <div class="flex items-center gap-8">
                <button class="w-[42px] h-[42px] rounded-full bg-[#3CCB5B] flex items-center justify-center shadow-sm hover:opacity-90 active:scale-90 transition-all">
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8.5 14C6.01472 14 4 12.2091 4 10C4 7.79086 6.01472 6 8.5 6C10.9853 6 13 7.79086 13 10C13 10.158 12.9882 10.3138 12.9652 10.4671C12.5028 10.1654 11.9673 10 11.4 10C9.52223 10 8 11.5222 8 13.4C8 13.6062 8.01837 13.808 8.05342 14.0042C8.20014 14.0014 8.34907 14 8.5 14ZM19 14.5C19 16.433 17.2091 18 15 18C14.4925 18 14.01 17.9048 13.5707 17.7346L11.5 19L11.8906 17.242C10.7486 16.7118 10 15.6664 10 14.5C10 12.567 12.2386 11 15 11C17.7614 11 20 12.567 20 14.5C20 15.549 19.4673 16.49 18.6364 17.1121L19 18.5L17.2589 17.5818C16.5684 17.8524 15.8037 18 15 18H19V14.5Z"/></svg>
                </button>
                <button class="w-[42px] h-[42px] rounded-full bg-[#6BB5F1] flex items-center justify-center shadow-sm hover:opacity-90 active:scale-90 transition-all">
                    <svg class="w-5 h-5 text-white transform scale-[1.15]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8 2 6 5 6 9.5C6 11.5 6.5 13.5 7.5 15C6.5 15.5 5 16.5 5 18.5C5 19.5 6 21 8.5 21C9.5 21 10.5 20.5 11 20C11.5 20.5 12.5 21 13.5 21C16 21 17 19.5 17 18.5C17 16.5 15.5 15.5 14.5 15C15.5 13.5 16 11.5 16 9.5C16 5 14 2 12 2ZM9 10C9 9.44772 9.44772 9 10 9C10.5523 9 11 9.44772 11 10C11 10.5523 10.5523 11 10 11C9.44772 11 9 10.5523 9 10ZM14 11C13.4477 11 13 10.5523 13 10C13 9.44772 13.4477 9 14 9C14.5523 9 15 9.44772 15 10C15 10.5523 14.5523 11 14 11Z"/></svg>
                </button>
            </div>
        </footer>

    </main>

    <script>
        // 返回功能
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave');
            
            setTimeout(() => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = 'index.html';
                }
            }, 280); 
        }

        // 登录校验核心逻辑
        function handleLogin() {
            const userVal = document.getElementById('login-username').value.trim();
            const passVal = document.getElementById('login-password').value.trim();

            if (!userVal || !passVal) {
                alert('请输入账号和密码！');
                return;
            }

            // 1. 默认超级管理员身份
            if (userVal === 'admin' && passVal === 'admin') {
                proceedToDashboard();
                return;
            }

            // 2. 从 LocalStorage 检索用户身份
            let users = JSON.parse(localStorage.getItem('sys_users')) || [];
            const matchedUser = users.find(u => u.username === userVal && u.password === passVal);

            if (matchedUser) {
                // 登录成功
                proceedToDashboard();
            } else {
                // 登录失败
                alert('账号或密码错误！');
            }
        }

        // 处理登录成功后的页面切换动画与跳转
        function proceedToDashboard() {
            const main = document.getElementById('app-main');
            // 复用 page-leave 的丝滑退出动画
            main.classList.remove('page-enter');
            main.classList.add('page-leave');
            
            // 等待动画结束，跳转到 dashboard
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 280);
        }
    </script>
</body>
</html>
