<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>猫咪百科 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 页面级切换动画 */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 0.5; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* [核心 B] 沉浸式内部滚动：隐藏由于高频滚动产生的丑陋滚动条 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* [核心 A] 级联丝滑入场：由下至上的弹性淡入 */
        @keyframes staggeredFadeUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .stagger-item {
            opacity: 0;
            animation: staggeredFadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
        }

        /* [核心 C] 磁性微交互：卡片按压反馈与图片缩放 */
        .micro-item {
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .micro-item:active {
            transform: scale(0.94);
            background-color: #F8FAFC;
        }
        .micro-img {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        /* 当整块 item 被按下或悬停时，内部图片略微放大 */
        .micro-item:active .micro-img, .micro-item:hover .micro-img {
            transform: scale(1.15);
        }

        /* [核心 D] 呼吸光晕特效按钮 */
        @keyframes breatheGlow {
            0%, 100% { 
                box-shadow: 0 4px 15px rgba(255, 255, 255, 0.5), inset 0 0 0px rgba(255, 255, 255, 0.2); 
            }
            50% { 
                box-shadow: 0 8px 25px rgba(255, 255, 255, 1), inset 0 0 10px rgba(255, 255, 255, 0.5); 
                transform: translateY(-1px);
            }
        }
        .breathe-btn {
            animation: breatheGlow 3s infinite ease-in-out;
            transition: all 0.2s;
        }
        .breathe-btn:active {
            transform: scale(0.96) translateY(2px);
            animation: none; /* 按下时停止呼吸，呈现真实物理下压 */
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF]">

        <header class="flex items-center justify-between px-5 pt-12 pb-3 flex-shrink-0 z-20 relative">
            <button onclick="handleBack()" class="p-2 -ml-2 active:scale-90 transition-transform">
                <svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1 class="text-[17px] font-bold tracking-wide text-gray-900 absolute left-1/2 -translate-x-1/2">猫咪百科</h1>
            <div class="w-6"></div> </header>

        <div class="px-5 pb-5 flex-shrink-0 z-20 stagger-item" style="animation-delay: 0.05s;">
            <div class="w-full bg-white rounded-full flex items-center px-4 py-3 shadow-[0_2px_10px_rgba(0,0,0,0.03)] border border-white/60 focus-within:shadow-[0_4px_15px_rgba(79,191,255,0.15)] focus-within:border-[#4FBFFF]/30 transition-all">
                <svg class="w-4 h-4 text-gray-400 mr-2 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" placeholder="输入猫咪名字" class="bg-transparent w-full text-[13px] text-gray-700 placeholder-gray-400 outline-none" />
            </div>
        </div>

        <div class="flex-1 px-5 pb-[110px] flex gap-4 overflow-hidden relative z-10">
            
            <div class="w-1/2 bg-white/95 backdrop-blur-md rounded-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-col h-full overflow-hidden stagger-item" style="animation-delay: 0.15s;">
                <div class="py-4 text-center border-b border-gray-100/60 shrink-0">
                    <h2 class="text-[14px] font-bold text-gray-800 flex items-center justify-center gap-1">
                        阅读排行 
                        <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </h2>
                </div>
                <div id="ranking-list" class="flex-1 overflow-y-auto hide-scrollbar p-3 flex flex-col gap-3">
                    </div>
            </div>

            <div class="w-1/2 bg-white/95 backdrop-blur-md rounded-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-col h-full overflow-hidden stagger-item" style="animation-delay: 0.25s;">
                <div class="py-4 text-center border-b border-gray-100/60 shrink-0">
                    <h2 class="text-[14px] font-bold text-gray-800 flex items-center justify-center gap-1">
                        猫咪类型 
                        <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </h2>
                </div>
                <div id="types-list" class="flex-1 overflow-y-auto hide-scrollbar p-3 flex flex-col gap-3">
                    </div>
            </div>

        </div>

        <div class="absolute bottom-0 left-0 w-full px-8 pb-[calc(1.5rem+env(safe-area-inset-bottom))] pt-6 bg-gradient-to-t from-[#E6F2FF] via-[#E6F2FF]/95 to-transparent z-30 stagger-item" style="animation-delay: 0.4s;">
            <button class="w-full bg-[#f8fafc] text-gray-800 text-[15px] font-bold py-3.5 rounded-full breathe-btn border border-white">
                开始阅读
            </button>
        </div>

    </main>

    <script>
        // --- 4. 高质量数据模拟 (Data Generation) ---
        
        // 左列：硬核知识排行 (10条)
        const rankingData = [
            { title: "猫咪为什么要绝育？", img: "1514888286974-6c03e2ca1dba" },
            { title: "如何科学判断猫咪是否超重？", img: "1573865526739-10659fec78a5" },
            { title: "猫咪频繁吐毛球怎么办？", img: "1495360010541-f48722b34f7d" },
            { title: "读懂猫的 10 种尾巴语言", img: "1543852786-1cf6624b9987" },
            { title: "新手接猫必看：首月指南", img: "1513360371669-4adf3dd7dff8" },
            { title: "猫粮配料表避坑核心指南", img: "1526336024174-e58f5cdd8e13" },
            { title: "猫咪乱尿的心理学深度分析", img: "1592194996308-7b43878e84a6" },
            { title: "换毛季主子防脱发全攻略", img: "1615397323286-46ce5738ab79" },
            { title: "室内猫需要打狂犬疫苗吗？", img: "1511044568932-338cba0ad8eb" },
            { title: "高龄猫咪的日常护理重点", img: "1606214174585-8241be9c5f85" }
        ];

        // 右列：猫咪类型 (4条)
        const catTypesData = [
            { name: "布偶猫", img: "1514888286974-6c03e2ca1dba" },
            { name: "波斯猫", img: "1543852786-1cf6624b9987" },
            { name: "蓝猫", img: "1513360371669-4adf3dd7dff8" },
            { name: "短毛猫", img: "1573865526739-10659fec78a5" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderRankingList();
            renderTypesList();
        });

        // 渲染左列 (带错落动效)
        function renderRankingList() {
            const container = document.getElementById('ranking-list');
            let html = '';
            rankingData.forEach((item, index) => {
                // 每次增加 0.05s 延迟，产生瀑布般的载入感
                const delay = 0.3 + (index * 0.05); 
                html += `
                    <div class="micro-item flex gap-2.5 items-center bg-white rounded-xl p-2 border border-gray-50/50 stagger-item" style="animation-delay: ${delay}s;">
                        <div class="w-[42px] h-[42px] rounded-[10px] overflow-hidden shrink-0 bg-gray-100">
                            <img src="https://images.unsplash.com/photo-${item.img}?q=80&w=120&h=120&auto=format&fit=crop" class="micro-img w-full h-full object-cover" alt="${item.title}">
                        </div>
                        <div class="flex-1 text-[12px] font-medium text-gray-700 leading-snug line-clamp-2 pr-1">
                            ${item.title}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 渲染右列 (带错落动效)
        function renderTypesList() {
            const container = document.getElementById('types-list');
            let html = '';
            catTypesData.forEach((cat, index) => {
                const delay = 0.4 + (index * 0.08);
                html += `
                    <div class="micro-item flex gap-3 items-center bg-white rounded-xl p-2 border border-gray-50/50 stagger-item" style="animation-delay: ${delay}s;">
                        <div class="w-[46px] h-[46px] rounded-[12px] overflow-hidden shrink-0 bg-gray-100">
                            <img src="https://images.unsplash.com/photo-${cat.img}?q=80&w=120&h=120&auto=format&fit=crop" class="micro-img w-full h-full object-cover" alt="${cat.name}">
                        </div>
                        <div class="flex-1 text-[13px] font-bold text-gray-800">
                            ${cat.name}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // --- 页面返回跳转逻辑 ---
        function handleBack() {
            const main = document.getElementById('app-main');
            // 移除入场动画，加入出场动画，让整个页面向右推走
            main.classList.remove('page-enter');
            main.classList.add('page-leave');
            setTimeout(() => {
                window.location.href = 'dashboard.html?from=encyclopedia';
            }, 300); 
        }
    </script>
</body>
</html>
