<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>视频 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 页面级切换动画 */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 0.5; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 隐藏滚动条但保留流畅弹性滚动 */
        .elastic-scroll {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Firefox */
        }
        .elastic-scroll::-webkit-scrollbar { display: none; /* Chrome/Safari */ }
        
        input { -webkit-tap-highlight-color: transparent; outline: none; }

        /* ================= 核心动效：直播间点赞飘屏 ================= */
        .like-particle {
            position: absolute;
            bottom: 0;
            right: 0;
            font-size: 24px;
            pointer-events: none;
            opacity: 0;
            animation: floatUp 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 1; transform: translate(calc(var(--tx) * 0.2), -20px) scale(1.2) rotate(calc(var(--tr) * 0.2)); }
            50% { opacity: 0.8; transform: translate(var(--tx), -120px) scale(1) rotate(var(--tr)); }
            100% { transform: translate(calc(var(--tx) * 1.5), -250px) scale(0.8) rotate(calc(var(--tr) * 1.5)); opacity: 0; }
        }

        /* ================= 核心动效：猫粮重力投喂 ================= */
        .food-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #8B5A2B; /* 猫粮棕色 */
            border-radius: 40%;
            pointer-events: none;
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
            animation: dropAndBounce 1.5s forwards;
            z-index: 30;
        }
        @keyframes dropAndBounce {
            0% { top: -10px; transform: rotate(0deg); opacity: 1; }
            60% { top: calc(100% - 30px); transform: rotate(var(--fr)); animation-timing-function: ease-out; }
            75% { top: calc(100% - 60px); transform: rotate(calc(var(--fr) + 45deg)); animation-timing-function: ease-in; }
            90% { top: calc(100% - 30px); transform: rotate(calc(var(--fr) + 90deg)); opacity: 1; }
            100% { top: calc(100% - 30px); transform: rotate(calc(var(--fr) + 120deg)); opacity: 0; }
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF]">

        <header class="flex items-center justify-between px-5 pt-12 pb-3 flex-shrink-0 z-20 relative text-gray-900">
            <button onclick="handleBack()" class="p-1 -ml-1 transition-transform active:scale-90">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1 class="text-[17px] font-bold tracking-wide absolute left-1/2 -translate-x-1/2">视频</h1>
            <div class="w-6"></div>
        </header>

        <div id="video-container" class="relative w-full aspect-video bg-black/5 flex-shrink-0 rounded-t-[20px] shadow-[inset_0_4px_12px_rgba(0,0,0,0.15)] overflow-hidden z-10">
            <img src="https://images.unsplash.com/photo-1548247416-ec66f4900b2e?q=80&w=800&auto=format&fit=crop" alt="Cat eating" class="w-full h-full object-cover">
            
            <div class="absolute top-2 left-3 bg-black/30 backdrop-blur-sm text-white text-[11px] px-2 py-0.5 rounded shadow-sm font-medium z-20">
                2026-04-06 10:35:07
            </div>

            <div class="absolute bottom-3 left-3 bg-black/40 backdrop-blur-sm text-white text-[10px] px-2.5 py-1 rounded-full shadow-sm font-medium z-20">
                2人在看
            </div>

            <button class="absolute bottom-3 right-3 text-white/90 active:scale-90 transition-transform drop-shadow-md z-20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                </svg>
            </button>
        </div>

        <div class="w-full bg-[#9DA09D]/90 backdrop-blur-md text-white px-4 py-1.5 flex justify-between items-center flex-shrink-0 text-[11px] font-medium shadow-md z-20 relative -mt-1">
            <div class="flex items-center gap-1.5">
                <svg class="w-4 h-4 text-white/80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                <span>今日投喂<span id="feed-count" class="text-[#F1C84B] font-bold px-0.5 transition-all duration-300">2000</span>g</span>
            </div>
            <div class="flex items-center gap-1.5">
                <svg class="w-4 h-4 text-white/80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span>今日<span id="feeder-count" class="text-[#F1C84B] font-bold px-0.5">6</span>人投喂</span>
            </div>
        </div>

        <div id="log-container" class="flex-1 elastic-scroll px-5 py-4 flex flex-col gap-2 relative z-10 scroll-smooth pb-24">
            <div class="text-[14px]">
                <span class="font-bold text-[#EAB308]">系统:</span>
                <span class="text-gray-500 ml-1">欢迎来到直播间！</span>
            </div>
        </div>

        <div id="animation-anchor" class="absolute bottom-[65px] right-[40px] w-0 h-0 z-40 pointer-events-none"></div>

        <div class="absolute bottom-0 w-full px-4 pb-[calc(1rem+env(safe-area-inset-bottom))] pt-3 bg-gradient-to-t from-[#E6F2FF] via-[#E6F2FF]/90 to-transparent z-30 flex items-center gap-2">
            
            <div class="flex-1 relative flex items-center">
                <input id="chat-input" type="text" inputmode="text" placeholder="说点什么吧" onkeypress="handleKeypress(event)" class="w-full h-9 bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] rounded-full pl-4 pr-10 text-[13px] text-gray-800 placeholder-[#B0B6C0]" />
                
                <button onmousedown="triggerEmojiKeyboard(event)" class="absolute right-3 text-[#B0B6C0] hover:text-gray-500 transition-colors active:scale-90">
                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
            </div>
            
            <div class="flex items-center gap-2 flex-shrink-0">
                <button onclick="triggerFeedAnimation()" class="w-[34px] h-[34px] rounded-full bg-white flex items-center justify-center text-gray-600 shadow-[0_2px_10px_rgba(0,0,0,0.05)] active:scale-90 active:bg-orange-50 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </button>
                <button onclick="triggerLikeAnimation()" class="w-[34px] h-[34px] rounded-full bg-white flex items-center justify-center text-gray-600 shadow-[0_2px_10px_rgba(0,0,0,0.05)] active:scale-90 active:text-red-400 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>
                </button>
                <button onclick="appendLog('分享了该视频', true)" class="w-[34px] h-[34px] rounded-full bg-white flex items-center justify-center text-gray-600 shadow-[0_2px_10px_rgba(0,0,0,0.05)] active:scale-90 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        // 获取当前用户
        const getCurrentUser = () => localStorage.getItem('current_session_user') || '游客';

        // 核心功能 1：日志追加器
        function appendLog(message, isSystemAction = false) {
            const logContainer = document.getElementById('log-container');
            const div = document.createElement('div');
            // 添加极快滑入动画，增强即时交互感
            div.className = 'text-[14px] animate-[slideInRight_0.25s_ease-out_forwards]'; 
            
            const actionColor = isSystemAction ? 'text-[#F1C84B] font-medium' : 'text-gray-600';
            div.innerHTML = `
                <span class="font-bold text-[#EAB308]">${getCurrentUser()}:</span> 
                <span class="ml-1 ${actionColor}">${message}</span>
            `;
            
            logContainer.appendChild(div);
            // 弹性滚动到底部
            logContainer.scrollTo({ top: logContainer.scrollHeight, behavior: 'smooth' });
        }

        // 核心功能 2：发送聊天消息
        function handleKeypress(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('chat-input');
                const val = input.value.trim();
                if (!val) return;
                
                appendLog(val, false);
                input.value = '';
                input.blur(); // 发送后收起键盘
            }
        }

        // 核心功能 3：表情输入法唤醒联动
        function triggerEmojiKeyboard(event) {
            // 使用 onmousedown 并在原生事件中阻止默认失焦，保证能顺利唤醒键盘
            event.preventDefault(); 
            const input = document.getElementById('chat-input');
            input.focus();
            // 在输入框中预填一个表情占位，提示用户此处可输入表情
            // 真实业务中，通常系统键盘弹起后，用户可自行切换表情面板
        }

        // 核心功能 4：炫技级直播点赞粒子特效
        const emojis = ['❤️', '👍', '🐱', '✨', '💖'];
        function triggerLikeAnimation() {
            const anchor = document.getElementById('animation-anchor');
            const particle = document.createElement('div');
            
            // 随机分配表情和 CSS 物理变量
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            const tx = (Math.random() - 0.5) * 80; // 横向左右飘散度 -40px ~ 40px
            const tr = (Math.random() - 0.5) * 60; // 旋转角度 -30deg ~ 30deg
            
            particle.className = 'like-particle';
            particle.innerText = randomEmoji;
            // 注入 CSS 变量驱动轨迹
            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--tr', `${tr}deg`);
            
            anchor.appendChild(particle);
            
            // 动画结束后清理 DOM，释放内存
            setTimeout(() => { particle.remove(); }, 2000);

            // 每点赞5次输出一次日志，避免刷屏
            if(!window.likeCount) window.likeCount = 0;
            window.likeCount++;
            if(window.likeCount % 5 === 0) {
                appendLog('点赞了该视频 ❤️', true);
            }
        }

        // 核心功能 5：猫粮重力投喂特效
        function triggerFeedAnimation() {
            const videoContainer = document.getElementById('video-container');
            const feedCountEl = document.getElementById('feed-count');
            
            // 生成 3-5 颗猫粮颗粒
            const particleCount = Math.floor(Math.random() * 3) + 3; 
            
            for(let i=0; i<particleCount; i++) {
                const food = document.createElement('div');
                food.className = 'food-particle';
                
                // 随机起始位置 (视频上方中心区域)
                const leftPos = 40 + Math.random() * 20; 
                // 随机旋转
                const finalRotation = Math.random() * 360; 
                // 随机延迟让颗粒下落有层次感
                const delay = Math.random() * 0.3;
                
                food.style.left = `${leftPos}%`;
                food.style.setProperty('--fr', `${finalRotation}deg`);
                food.style.animationDelay = `${delay}s`;
                
                videoContainer.appendChild(food);
                setTimeout(() => { food.remove(); }, 1500 + delay * 1000);
            }

            // 更新数字及动效
            const currentFeed = parseInt(feedCountEl.innerText);
            const feedAmount = 10; // 每次投喂10g
            feedCountEl.innerText = currentFeed + feedAmount;
            
            // 数字跳动特效
            feedCountEl.classList.add('scale-150', 'text-orange-500');
            setTimeout(() => feedCountEl.classList.remove('scale-150', 'text-orange-500'), 200);

            // 写入日志
            appendLog(`投喂了约${feedAmount}g猫粮 🐾`, true);
        }

        // 返回逻辑
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave');
            setTimeout(() => {
                window.location.href = 'dashboard.html?from=video';
            }, 300); 
        }
    </script>
</body>
</html>
