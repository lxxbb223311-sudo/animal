<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>账户设置 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 原生 SPA 级平滑切换动画 */
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 0.5; } to { transform: translateX(100%); opacity: 0; } }
        
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-right { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { -webkit-tap-highlight-color: transparent; outline: none; }

        /* 炫技：文本更新时的高亮闪烁动画 */
        @keyframes highlightFlash {
            0% { color: #4FBFFF; transform: scale(1.05); }
            100% { color: inherit; transform: scale(1); }
        }
        .text-flash { animation: highlightFlash 0.8s ease-out; }

        /* 模态框与底部抽屉动画 */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        .overlay-enter { animation: fadeIn 0.3s forwards; }
        .overlay-leave { animation: fadeOut 0.3s forwards; }
        .sheet-enter { animation: slideUp 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .sheet-leave { animation: slideDown 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .modal-enter { animation: popIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* Switch Toggle 样式 */
        .toggle-checkbox:checked { right: 0; border-color: #4FBFFF; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4FBFFF; }
        .toggle-checkbox:checked + .toggle-label:before { transform: translateX(100%); }
        .toggle-label:before { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-[#F3F4F6] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF]">

        <header class="pt-[env(safe-area-inset-top)] pb-2 flex-shrink-0 z-40 bg-[#E6F2FF]/95 backdrop-blur-md sticky top-0">
            <div class="pt-8 px-4 flex items-center justify-between relative">
                <button onclick="handleBack()" class="p-2 -ml-2 active:scale-90 transition-transform text-gray-900 shrink-0 z-10">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h1 class="text-[17px] font-bold text-gray-900 absolute left-1/2 -translate-x-1/2">账户设置</h1>
                <div class="w-6"></div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto hide-scrollbar pb-[100px]">
            
            <div class="px-5 py-2 mt-2">
                <span class="text-[12px] text-gray-400 font-medium tracking-wide">基础信息</span>
            </div>
            
            <div class="bg-white/70 backdrop-blur-sm w-full flex flex-col shadow-[0_2px_10px_rgba(0,0,0,0.01)] border-y border-white/50">
                
                <div class="flex justify-between items-center px-5 py-3 border-b border-gray-100/60 active:bg-gray-50/50 transition-colors cursor-pointer" onclick="document.getElementById('avatar-upload').click()">
                    <span class="text-[15px] font-medium text-gray-800">头像</span>
                    <div class="flex items-center gap-2">
                        <img id="avatar-img" src="https://api.dicebear.com/7.x/notionists/svg?seed=user" class="w-[38px] h-[38px] rounded-full object-cover shadow-sm bg-white border border-gray-100">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                    <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                </div>

                <div class="flex justify-between items-center px-5 py-4 border-b border-gray-100/60 active:bg-gray-50/50 transition-colors cursor-pointer" onclick="openTextEditModal('昵称', 'name')">
                    <span class="text-[15px] font-medium text-gray-800">昵称</span>
                    <div class="flex items-center gap-2">
                        <span id="display-name" class="text-[15px] text-gray-800 font-medium">加载中</span>
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </div>

                <div class="flex justify-between items-center px-5 py-4 border-b border-gray-100/60 bg-gray-50/20">
                    <span class="text-[15px] font-medium text-gray-800">ID</span>
                    <span class="text-[14px] text-gray-400 font-medium">12345678</span>
                </div>

                <div class="flex justify-between items-center px-5 py-4 border-b border-gray-100/60 active:bg-gray-50/50 transition-colors cursor-pointer" onclick="openTextEditModal('联系电话', 'phone')">
                    <span class="text-[15px] font-medium text-gray-800">联系电话</span>
                    <div class="flex items-center gap-2">
                        <span id="display-phone" class="text-[15px] text-gray-800 font-medium">未设置</span>
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </div>

                <div class="flex justify-between items-center px-5 py-4 active:bg-gray-50/50 transition-colors cursor-pointer" onclick="handleLogout()">
                    <span class="text-[15px] font-bold text-gray-800">退出登录</span>
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </div>

            <div class="px-5 py-2 mt-6 flex justify-between items-end">
                <span class="text-[12px] text-gray-400 font-medium tracking-wide">地址管理</span>
                <button onclick="openAddressSheet(null)" class="text-[12px] font-bold text-[#4FBFFF] active:opacity-70">+ 添加地址</button>
            </div>
            
            <div id="address-list" class="bg-white/70 backdrop-blur-sm w-full flex flex-col shadow-[0_2px_10px_rgba(0,0,0,0.01)] border-y border-white/50">
                </div>

        </div>

        <div id="backdrop" class="hidden fixed inset-0 bg-black/40 z-50 transition-opacity opacity-0" onclick="closeAllModals()"></div>

        <div id="text-edit-modal" class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] bg-white rounded-2xl p-5 z-50 shadow-2xl">
            <h2 id="modal-title" class="text-[16px] font-bold text-gray-900 text-center mb-4">修改</h2>
            <input type="text" id="modal-input" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-[14px] text-gray-800 focus:border-[#4FBFFF] transition-colors mb-5" />
            <div class="flex gap-3">
                <button onclick="closeAllModals()" class="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-600 text-[14px] font-bold active:scale-95 transition-transform">取消</button>
                <button onclick="saveTextEdit()" class="flex-1 py-2.5 rounded-xl bg-[#4FBFFF] text-white text-[14px] font-bold active:scale-95 transition-transform shadow-md">保存</button>
            </div>
        </div>

        <div id="address-sheet" class="hidden fixed bottom-0 left-0 w-full max-w-[400px] bg-white rounded-t-3xl pt-5 pb-[calc(2rem+env(safe-area-inset-bottom))] px-6 z-50 shadow-[0_-10px_30px_rgba(0,0,0,0.1)] transform translate-y-full">
            <div class="flex justify-between items-center mb-6">
                <h2 id="sheet-title" class="text-[17px] font-bold text-gray-900">编辑地址</h2>
                <button onclick="closeAllModals()" class="p-1 active:bg-gray-100 rounded-full text-gray-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            
            <div class="flex flex-col gap-4 mb-6">
                <input type="text" id="addr-name" placeholder="收货人姓名" class="w-full border-b border-gray-200 px-1 py-2 text-[15px] focus:border-[#4FBFFF] transition-colors" />
                <input type="tel" id="addr-phone" placeholder="手机号码" class="w-full border-b border-gray-200 px-1 py-2 text-[15px] focus:border-[#4FBFFF] transition-colors" />
                <textarea id="addr-detail" placeholder="详细地址 (如省市区、街道、门牌号)" class="w-full border-b border-gray-200 px-1 py-2 text-[15px] focus:border-[#4FBFFF] transition-colors h-16 resize-none"></textarea>
            </div>

            <div class="flex justify-between items-center mb-8 px-1">
                <span class="text-[15px] text-gray-800 font-medium">设为默认地址</span>
                <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" id="addr-default" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out"/>
                    <label for="addr-default" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                </div>
            </div>

            <div class="flex gap-3">
                <button id="btn-delete-addr" onclick="deleteAddress()" class="w-[80px] py-3 rounded-xl bg-red-50 text-red-500 text-[15px] font-bold active:scale-95 transition-transform hidden">删除</button>
                <button onclick="saveAddress()" class="flex-1 py-3 rounded-xl bg-[#4FBFFF] text-white text-[15px] font-bold shadow-md active:scale-95 transition-transform">保存地址</button>
            </div>
        </div>

        <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/80 backdrop-blur-sm text-white px-5 py-2.5 rounded-lg shadow-lg z-[100] text-[14px] font-medium opacity-0 pointer-events-none transition-opacity duration-300">
            提示内容
        </div>

    </main>

    <script>
        // ================= 状态管理与初始化 =================
        let currentEditKey = ''; // 正在编辑的字段 (name 或 phone)
        let editingAddrId = null; // 正在编辑的地址ID

        document.addEventListener('DOMContentLoaded', () => {
            initProfileData();
            renderAddresses();
        });

        function initProfileData() {
            // 读取头像
            const avatarData = localStorage.getItem('user_avatar');
            const user = localStorage.getItem('current_session_user') || 'Cc';
            if (avatarData) {
                document.getElementById('avatar-img').src = avatarData;
            } else {
                document.getElementById('avatar-img').src = `https://api.dicebear.com/7.x/notionists/svg?seed=${user}`;
            }

            // 读取昵称和电话
            document.getElementById('display-name').textContent = user;
            document.getElementById('display-phone').textContent = localStorage.getItem('user_phone') || '15800000000';
        }

        // ================= 炫技 A：原生相册选取与 Base64 缓存 =================
        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const b64 = e.target.result;
                const imgEl = document.getElementById('avatar-img');
                
                // 瞬间更新DOM并增加一个小小的缩放动效反馈
                imgEl.src = b64;
                imgEl.style.transform = 'scale(1.1)';
                setTimeout(() => imgEl.style.transform = 'scale(1)', 200);

                // 缓存到本地
                localStorage.setItem('user_avatar', b64);
                showToast('头像更新成功');
            }
            reader.readAsDataURL(file);
        }

        // ================= 炫技 B：通用文本输入 Modal =================
        function openTextEditModal(title, key) {
            currentEditKey = key;
            document.getElementById('modal-title').textContent = '修改' + title;
            
            // 获取当前值填入
            let val = '';
            if (key === 'name') val = document.getElementById('display-name').textContent;
            if (key === 'phone') val = document.getElementById('display-phone').textContent;
            
            const inputEl = document.getElementById('modal-input');
            inputEl.value = val;
            inputEl.type = key === 'phone' ? 'tel' : 'text';

            showModal('text-edit-modal');
        }

        function saveTextEdit() {
            const val = document.getElementById('modal-input').value.trim();
            if(!val) return showToast('内容不能为空');

            let targetId = '';
            if(currentEditKey === 'name') {
                localStorage.setItem('current_session_user', val);
                targetId = 'display-name';
            } else if (currentEditKey === 'phone') {
                localStorage.setItem('user_phone', val);
                targetId = 'display-phone';
            }

            // 更新DOM并高亮闪烁
            const el = document.getElementById(targetId);
            el.textContent = val;
            el.classList.remove('text-flash');
            void el.offsetWidth; // 触发重绘
            el.classList.add('text-flash');

            closeAllModals();
            showToast('修改成功');
        }

        // ================= 炫技 C：地址管理 CRUD 系统 =================
        function getAddresses() {
            let addrs = JSON.parse(localStorage.getItem('user_addresses'));
            if (!addrs || addrs.length === 0) {
                // 注入初始模拟数据 (完美还原图2)
                const user = localStorage.getItem('current_session_user') || 'Cc';
                addrs = [
                    { id: 1, name: user, phone: '18200000000', detail: '南京市秦淮区南京工业职业技术大学', isDefault: true },
                    { id: 2, name: '小明', phone: '18200000000', detail: '南京市秦淮区南京工业职业技术大学', isDefault: false }
                ];
                localStorage.setItem('user_addresses', JSON.stringify(addrs));
            }
            return addrs;
        }

        function renderAddresses() {
            const addrs = getAddresses();
            const container = document.getElementById('address-list');
            
            let html = '';
            addrs.forEach((addr, index) => {
                const borderClass = index === addrs.length - 1 ? '' : 'border-b border-gray-100/60';
                const defaultTag = addr.isDefault ? `<span class="bg-[#F1C84B] text-gray-900 text-[10px] font-bold px-2 py-0.5 rounded-full ml-2 shadow-sm scale-90 origin-left">默认</span>` : '';
                
                // 给每个地址卡片增加淡入动画
                html += `
                <div class="flex justify-between items-center px-5 py-4 ${borderClass} animate-[fadeIn_0.3s_ease]">
                    <div class="flex flex-col gap-1 pr-4">
                        <div class="flex items-center">
                            <span class="text-[15px] text-gray-900 font-medium">${addr.name}</span>
                            <span class="text-[15px] text-gray-900 font-medium ml-2">${addr.phone}</span>
                            ${defaultTag}
                        </div>
                        <span class="text-[13px] text-gray-500 leading-snug line-clamp-2">${addr.detail}</span>
                    </div>
                    <button onclick="openAddressSheet(${addr.id})" class="p-2 -mr-2 text-gray-600 active:scale-90 transition-transform">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </button>
                </div>`;
            });
            container.innerHTML = html;
        }

        function openAddressSheet(id) {
            editingAddrId = id;
            const addrs = getAddresses();
            const btnDel = document.getElementById('btn-delete-addr');
            const isDefaultCb = document.getElementById('addr-default');

            if (id) {
                // 编辑模式
                document.getElementById('sheet-title').textContent = '编辑地址';
                const target = addrs.find(a => a.id === id);
                document.getElementById('addr-name').value = target.name;
                document.getElementById('addr-phone').value = target.phone;
                document.getElementById('addr-detail').value = target.detail;
                isDefaultCb.checked = target.isDefault;
                btnDel.classList.remove('hidden');
            } else {
                // 新增模式
                document.getElementById('sheet-title').textContent = '新增地址';
                document.getElementById('addr-name').value = '';
                document.getElementById('addr-phone').value = '';
                document.getElementById('addr-detail').value = '';
                isDefaultCb.checked = false;
                btnDel.classList.add('hidden');
            }

            showModal('address-sheet', 'sheet');
        }

        function saveAddress() {
            const name = document.getElementById('addr-name').value.trim();
            const phone = document.getElementById('addr-phone').value.trim();
            const detail = document.getElementById('addr-detail').value.trim();
            const isDefault = document.getElementById('addr-default').checked;

            if(!name || !phone || !detail) return showToast('请填写完整地址信息');

            let addrs = getAddresses();

            // 如果设为默认，将其他全部置为非默认
            if(isDefault) {
                addrs.forEach(a => a.isDefault = false);
            }

            if (editingAddrId) {
                // 更新
                const idx = addrs.findIndex(a => a.id === editingAddrId);
                addrs[idx] = { ...addrs[idx], name, phone, detail, isDefault };
            } else {
                // 新增
                // 如果是第一条，强制默认
                const finalDefault = addrs.length === 0 ? true : isDefault;
                addrs.push({ id: Date.now(), name, phone, detail, isDefault: finalDefault });
            }

            localStorage.setItem('user_addresses', JSON.stringify(addrs));
            closeAllModals();
            renderAddresses();
            showToast('地址保存成功');
        }

        function deleteAddress() {
            if(!confirm('确定要删除该地址吗？')) return;
            let addrs = getAddresses();
            addrs = addrs.filter(a => a.id !== editingAddrId);
            localStorage.setItem('user_addresses', JSON.stringify(addrs));
            closeAllModals();
            renderAddresses();
            showToast('已删除');
        }

        // ================= 弹窗控制与基础能力 =================
        function showModal(modalId, type = 'modal') {
            const backdrop = document.getElementById('backdrop');
            const modal = document.getElementById(modalId);
            
            backdrop.classList.remove('hidden', 'overlay-leave');
            backdrop.classList.add('overlay-enter');
            
            modal.classList.remove('hidden', type === 'sheet' ? 'sheet-leave' : 'modal-leave');
            modal.classList.add(type === 'sheet' ? 'sheet-enter' : 'modal-enter');
        }

        function closeAllModals() {
            const backdrop = document.getElementById('backdrop');
            backdrop.classList.remove('overlay-enter');
            backdrop.classList.add('overlay-leave');
            
            const textModal = document.getElementById('text-edit-modal');
            if(!textModal.classList.contains('hidden')) {
                // 偷个懒直接隐去
                textModal.classList.add('hidden');
            }

            const sheet = document.getElementById('address-sheet');
            if(!sheet.classList.contains('hidden')) {
                sheet.classList.remove('sheet-enter');
                sheet.classList.add('sheet-leave');
                setTimeout(() => sheet.classList.add('hidden'), 300);
            }
            
            setTimeout(() => backdrop.classList.add('hidden'), 300);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function handleLogout() {
            if(confirm('确定要退出登录吗？所有本地缓存将被清除。')) {
                localStorage.clear(); // 清理所有炫技留下的本地状态
                const main = document.getElementById('app-main');
                main.classList.remove('page-enter');
                main.classList.add('page-leave-right');
                setTimeout(() => {
                    window.location.href = 'index.html'; // 路由回登录页
                }, 300);
            }
        }

        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave-right');
            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 300); 
        }
    </script>
</body>
</html>
