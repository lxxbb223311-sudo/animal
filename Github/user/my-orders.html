<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我的订单 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 原生 SPA 级平滑切换动画 */
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 0.5; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes slideOutLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-30%); opacity: 0.5; } }
        
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-right { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-left { animation: slideOutLeft 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { -webkit-tap-highlight-color: transparent; outline: none; }

        /* 炫技 A：级联滑入动效 (Staggered Fade-up) */
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .stagger-item {
            opacity: 0;
            animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF] shadow-2xl">

        <header class="pt-[env(safe-area-inset-top)] pb-2 flex-shrink-0 z-40 bg-[#E6F2FF]/95 backdrop-blur-md sticky top-0">
            <div class="pt-8 px-4 flex items-center gap-3 relative">
                <button onclick="handleBack()" class="p-2 -ml-2 active:scale-90 transition-transform text-gray-900 shrink-0">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <div class="flex-1 bg-white/70 backdrop-blur-sm rounded-full flex items-center px-4 py-2 border border-white/60 shadow-sm transition-all focus-within:bg-white focus-within:shadow-md">
                    <svg class="w-[16px] h-[16px] text-gray-400 mr-2 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" placeholder="搜索我的订单" class="bg-transparent w-full text-[14px] text-gray-800 placeholder-gray-400" />
                </div>
            </div>

            <div class="flex justify-between items-center mt-5 px-6 relative">
                <div class="text-[14px] font-bold text-gray-900 relative">
                    全部
                    <div class="absolute -bottom-[8px] left-1/2 -translate-x-1/2 w-8 h-[3px] bg-[#F1C84B] rounded-full"></div>
                </div>
                <div class="text-[14px] font-medium text-gray-500 cursor-pointer active:opacity-70">待付款</div>
                <div class="text-[14px] font-medium text-gray-500 cursor-pointer active:opacity-70">待收货</div>
                <div class="text-[14px] font-medium text-gray-500 cursor-pointer active:opacity-70">退款/售后</div>
            </div>
        </header>

        <div id="order-list" class="flex-1 overflow-y-auto hide-scrollbar px-4 pt-5 pb-[env(safe-area-inset-bottom)] flex flex-col gap-4">
            </div>

    </main>

    <script>
        // --- 初始化渲染订单列表 ---
        document.addEventListener('DOMContentLoaded', () => {
            renderOrders();
        });

        function renderOrders() {
            const container = document.getElementById('order-list');
            let myOrders = [];
            
            try {
                myOrders = JSON.parse(localStorage.getItem('my_orders')) || [];
            } catch (e) {
                myOrders = [];
            }

            // 空状态处理
            if (myOrders.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center mt-32 opacity-60 stagger-item">
                        <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        <span class="text-[14px] text-gray-500 font-medium">暂无订单记录</span>
                    </div>`;
                return;
            }

            let html = '';
            myOrders.forEach((order, index) => {
                const delay = index * 0.1; // 级联入场延迟
                
                // 计算该订单总件数
                const totalItemsCount = order.items.reduce((sum, item) => sum + item.quantity, 0);
                // 展示第一个商品作为主要视觉
                const firstItem = order.items[0];
                // 商店类别标头 (这里取第一个商品的 attr 或者通用文案)
                const categoryText = firstItem.attr || '商品';

                html += `
                <div class="bg-white rounded-[20px] p-4 shadow-sm border border-gray-100 flex flex-col stagger-item" style="animation-delay: ${delay}s;">
                    <div class="flex items-center justify-between pb-3 border-b border-gray-100/70 mb-3">
                        <div class="flex items-center gap-2">
                            <div class="bg-[#F1C84B] rounded-full w-6 h-6 flex items-center justify-center">
                                <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                            </div>
                            <span class="text-[14px] font-bold text-gray-800">${categoryText} <span class="text-gray-400 font-normal ml-0.5">&gt;</span></span>
                        </div>
                        <span class="text-[12px] font-medium text-gray-400">${order.status}</span>
                    </div>
                    
                    <div class="flex items-start gap-3 w-full mb-4">
                        <div class="w-[60px] h-[60px] rounded-[12px] overflow-hidden shrink-0 bg-gray-50 border border-gray-100">
                            <img src="${firstItem.image}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex flex-col justify-center h-[60px] flex-1">
                            <span class="text-[14px] font-bold text-gray-800 leading-tight line-clamp-1">${firstItem.name}</span>
                            <span class="text-[11px] text-gray-400 mt-1 line-clamp-1">属性：${firstItem.attr}${order.items.length > 1 ? ' 等多件商品' : ''}</span>
                        </div>
                        <div class="h-[60px] flex items-center">
                            <span class="text-[12px] font-medium text-gray-500">共${totalItemsCount}件</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mt-auto">
                        <span class="text-[10px] text-gray-400 font-medium">下单时间：${order.date}</span>
                        <div class="text-[11px] text-gray-600 font-medium">合计 <span class="text-[14px] font-bold text-gray-900 ml-0.5">￥${order.total}</span></div>
                    </div>

                    <div class="flex justify-end mt-4">
                        <button onclick="buyAgain('${order.orderId}')" class="bg-[#F1C84B] text-gray-900 rounded-full px-5 py-1.5 text-[13px] font-bold shadow-sm active:scale-95 transition-all">
                            再来一单
                        </button>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- 炫技 B：再来一单核心转场引擎 (Re-checkout Engine) ---
        function buyAgain(orderId) {
            const myOrders = JSON.parse(localStorage.getItem('my_orders')) || [];
            const targetOrder = myOrders.find(o => o.orderId === orderId);

            if (!targetOrder) {
                alert('未找到该订单信息！');
                return;
            }

            // 【架构解耦】：将历史订单中的 items 重新投射到结算快照区，完美复用结算与支付页面
            localStorage.setItem('current_checkout', JSON.stringify(targetOrder.items));

            // 执行丝滑推入动画前往订单确认页
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave-left');
            setTimeout(() => {
                window.location.href = 'order-confirm.html';
            }, 300);
        }

        // --- 路由系统 ---
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave-right');
            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 300); 
        }
    </script>
</body>
</html>
