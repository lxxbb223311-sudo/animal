<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>购物车 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 原生 SPA 级平滑切换动画 */
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 0.5; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes slideOutLeft { from { transform: translateX(0); opacity: 0.5; } to { transform: translateX(-100%); opacity: 0; } }
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-left { animation: slideOutLeft 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { -webkit-tap-highlight-color: transparent; outline: none; }

        /* 炫技 C：自定义 SVG 勾选框动画 (完美平滑线条描绘) */
        .custom-checkbox {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 1.5px solid #9CA3AF; /* 默认灰边 */
            display: flex; align-items: center; justify-content: center;
            transition: all 0.25s ease-out;
            cursor: pointer;
        }
        .custom-checkbox.checked {
            border-color: #4FBFFF; background-color: #4FBFFF;
        }
        .custom-checkbox path {
            stroke-dasharray: 24; 
            stroke-dashoffset: 24; /* 初始隐藏 */
            transition: stroke-dashoffset 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-checkbox.checked path {
            stroke-dashoffset: 0; /* 选中时画出 */
        }

        /* 炫技 A2：金额放大缩小 Bump 动画 */
        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); color: #F59E0B; }
            100% { transform: scale(1); }
        }
        .price-bump { animation: bump 0.3s ease-out; }

        /* 商品卡片淡入动画 */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cart-item-anim { opacity: 0; animation: fadeUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF]">

        <header class="sticky top-0 z-40 bg-[#E6F2FF]/95 backdrop-blur-xl px-5 pt-[env(safe-area-inset-top)] pb-2 flex-shrink-0">
            <div class="pt-10 flex items-center justify-between relative mb-6">
                <button onclick="handleBack()" class="p-2 -ml-2 active:scale-90 transition-transform text-gray-900 z-10">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h1 class="text-[18px] font-bold tracking-wide text-gray-900 absolute left-1/2 -translate-x-1/2">购物车</h1>
                <div class="w-6"></div> </div>
            
            <div class="flex justify-between items-center text-gray-800">
                <span class="text-[15px] font-bold">购物数量</span>
                <span class="text-[13px] font-medium active:opacity-60 cursor-pointer">管理</span>
            </div>
        </header>

        <div id="cart-list" class="flex-1 overflow-y-auto hide-scrollbar px-4 pt-3 pb-[100px] flex flex-col gap-4">
            </div>

        <div class="fixed bottom-0 w-full max-w-[400px] bg-[#E6F2FF]/95 backdrop-blur-md px-5 pt-3 pb-[calc(1.5rem+env(safe-area-inset-bottom))] flex items-center justify-between z-50 border-t border-white/50">
            
            <div class="flex items-center gap-2 cursor-pointer active:opacity-70" onclick="toggleSelectAll()">
                <div id="check-all" class="custom-checkbox bg-white">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <span class="text-[14px] text-gray-700 font-medium select-none">全选</span>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center font-bold text-[#F1C84B]">
                    <span class="text-[12px] mt-1 mr-0.5">￥</span>
                    <span id="total-price" class="text-[18px] transition-transform">0.00</span>
                </div>
                <button onclick="checkout()" class="bg-[#4FBFFF] text-white rounded-full px-6 py-2.5 text-[14px] font-bold shadow-[0_4px_15px_rgba(79,191,255,0.3)] active:scale-95 transition-all">
                    立即下单
                </button>
            </div>
        </div>

    </main>

    <script>
        // --- 核心数据加载 ---
        let cartItems = [];

        function loadCartData() {
            try {
                cartItems = JSON.parse(localStorage.getItem('my_cart_items')) || [];
            } catch (e) {
                cartItems = [];
            }
        }

        function saveCartData() {
            localStorage.setItem('my_cart_items', JSON.stringify(cartItems));
            updateTotal();
            checkAllStateSync();
        }

        // --- A. 炫技级：防精度丢失的安全结算计算 (Safe Float Math) ---
        function calculateTotal() {
            let totalCents = 0; // 使用分来计算，绝对避免浮点数精度 bug
            cartItems.forEach(item => {
                if (item.selected) {
                    // parseFloat 后乘以 100 转为正整数计算
                    const priceInCents = Math.round(parseFloat(item.price) * 100);
                    totalCents += priceInCents * item.quantity;
                }
            });
            return (totalCents / 100).toFixed(2);
        }

        function updateTotal() {
            const priceEl = document.getElementById('total-price');
            const newTotal = calculateTotal();
            
            if (priceEl.textContent !== newTotal) {
                priceEl.textContent = newTotal;
                // 触发金额跳动动画
                priceEl.classList.remove('price-bump');
                void priceEl.offsetWidth; // 重绘
                priceEl.classList.add('price-bump');
            }
        }

        // --- B. 炫技级：联动状态机 (Reactive Selection State) ---
        function checkAllStateSync() {
            const checkAllBox = document.getElementById('check-all');
            if (cartItems.length === 0) {
                checkAllBox.classList.remove('checked');
                return;
            }
            // 只要有一个没被选中，全选框就不亮
            const isAllSelected = cartItems.every(item => item.selected);
            if (isAllSelected) {
                checkAllBox.classList.add('checked');
            } else {
                checkAllBox.classList.remove('checked');
            }
        }

        function toggleSelectAll() {
            if (cartItems.length === 0) return;
            const isAllSelected = cartItems.every(item => item.selected);
            
            // 状态取反，同步到每一个子项
            cartItems.forEach(item => {
                item.selected = !isAllSelected;
            });
            
            saveCartData();
            renderCart(); // 重新渲染刷新勾选框 UI
        }

        function toggleSelection(id) {
            const item = cartItems.find(i => i.id === id);
            if (item) {
                item.selected = !item.selected;
                // 利用 DOM API 仅修改单个节点的 class，避免全局重绘带来的闪烁
                const checkbox = document.getElementById(`check-${id}`);
                if(item.selected) checkbox.classList.add('checked');
                else checkbox.classList.remove('checked');
                
                saveCartData();
            }
        }

        // --- D. 炫技级：步进器边界与状态同步反馈 ---
        function updateQuantity(id, delta, event) {
            event.stopPropagation(); // 阻止冒泡触发选中卡片
            
            const item = cartItems.find(i => i.id === id);
            if (!item) return;

            const newQty = item.quantity + delta;
            if (newQty < 1) return; // 边界拦截
            
            item.quantity = newQty;
            
            // 局部更新 UI
            document.getElementById(`qty-${id}`).textContent = item.quantity;
            
            // 边界视觉反馈：如果是1，减号变灰不可点
            const minusBtn = document.getElementById(`minus-${id}`);
            if (item.quantity === 1) {
                minusBtn.classList.replace('text-gray-800', 'text-gray-300');
            } else {
                minusBtn.classList.replace('text-gray-300', 'text-gray-800');
            }

            saveCartData();
        }

        // --- 核心：渲染商品列表 ---
        function renderCart() {
            const container = document.getElementById('cart-list');
            
            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center mt-20 opacity-60">
                        <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <span class="text-[14px] text-gray-500 font-medium">购物车空空如也，快去挑点好物吧</span>
                    </div>`;
                updateTotal();
                checkAllStateSync();
                return;
            }

            let html = '';
            cartItems.forEach((item, index) => {
                const checkedClass = item.selected ? 'checked' : '';
                const minusClass = item.quantity === 1 ? 'text-gray-300' : 'text-gray-800';
                const delay = index * 0.1;

                html += `
                <div class="cart-item-anim flex items-center gap-3 w-full bg-white/70 backdrop-blur-sm p-3 rounded-[20px] shadow-sm border border-white" style="animation-delay: ${delay}s;">
                    <div class="pl-1 shrink-0" onclick="toggleSelection(${item.id})">
                        <div id="check-${item.id}" class="custom-checkbox bg-white ${checkedClass}">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                    </div>
                    
                    <div class="w-[85px] h-[85px] rounded-[16px] overflow-hidden shrink-0 bg-gray-50 border border-gray-100">
                        <img src="${item.image}" class="w-full h-full object-cover" alt="${item.name}">
                    </div>

                    <div class="flex flex-col justify-between h-[80px] flex-1 py-0.5">
                        <div class="flex flex-col">
                            <span class="text-[15px] font-bold text-gray-900 leading-tight">${item.name}</span>
                            <span class="text-[11px] text-gray-400 mt-1">属性：${item.attr}</span>
                        </div>
                        
                        <div class="flex items-end justify-between mt-auto">
                            <div class="font-bold text-[#F1C84B] leading-none mb-0.5">
                                <span class="text-[11px]">￥</span><span class="text-[16px]">${parseFloat(item.price).toFixed(2)}</span>
                            </div>
                            
                            <div class="flex items-center bg-white border border-gray-200 rounded-full h-[26px] overflow-hidden shadow-sm">
                                <button id="minus-${item.id}" onclick="updateQuantity(${item.id}, -1, event)" class="w-7 h-full flex items-center justify-center ${minusClass} active:bg-gray-100 transition-colors">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"></path></svg>
                                </button>
                                <span id="qty-${item.id}" class="w-7 text-center text-[13px] font-bold text-gray-800 pointer-events-none">${item.quantity}</span>
                                <button onclick="updateQuantity(${item.id}, 1, event)" class="w-7 h-full flex items-center justify-center text-gray-800 active:bg-gray-100 transition-colors">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- 路由与流程操作 ---
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave');
            setTimeout(() => {
                window.location.href = 'shop.html';
            }, 300); 
        }

        function checkout() {
            const selectedItems = cartItems.filter(i => i.selected);
            if(selectedItems.length === 0) {
                alert('请先勾选需要结算的商品哦！');
                return;
            }
            localStorage.setItem('current_checkout', JSON.stringify(selectedItems));
            
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave-left');
            setTimeout(() => {
                window.location.href = 'order-confirm.html';
            }, 300);
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadCartData();
            renderCart();
            updateTotal();
            checkAllStateSync();
        });
    </script>
</body>
</html>
