<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="网站名称">
    <link rel="apple-touch-icon" href="/icon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>猫咪图鉴 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style type="text/tailwindcss">
        @layer components {
            .tag-blue { @apply px-2.5 py-0.5 bg-[#4FBFFF] text-white text-[11px] font-bold rounded-full shadow-sm; }
            .tag-yellow { @apply px-2.5 py-0.5 bg-[#F1C84B] text-gray-800 text-[11px] font-bold rounded-full shadow-sm; }
            .tag-outline { @apply px-2.5 py-0.5 bg-transparent border border-[#F1C84B] text-[#D4A017] text-[11px] font-bold rounded-full; }
            .btn-primary { @apply w-full bg-[#4FBFFF] text-white rounded-xl py-3 font-bold tracking-widest mt-4 shadow-md active:scale-95 transition-all duration-200; }
            .icon-btn { @apply p-2 active:scale-90 transition-transform text-gray-800; }
        }
    </style>

    <style>
        /* 页面切换动画 */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 0.5; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 隐藏滚动条但保留功能 */
        ::-webkit-scrollbar { display: none; }
        input { -webkit-tap-highlight-color: transparent; outline: none; }

        /* 炫技 B: 级联入场动画 */
        @keyframes cascadeSlideUp {
            from { transform: translateY(40px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .cascade-enter {
            opacity: 0; /* 初始隐藏 */
            animation: cascadeSlideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* 炫技 A: 3D 视角透视容器 */
        .perspective-container {
            perspective: 1200px;
            transform-style: preserve-3d;
        }
        .tilt-card {
            transform: translateZ(0);
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
            will-change: transform;
        }

        /* 炫技 C: 动态过滤平滑折叠过渡 */
        .cat-card-wrapper {
            transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 0.3s ease, 
                        transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        margin-bottom 0.4s ease;
            transform-origin: top center;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 selection:bg-[#4FBFFF] selection:text-white overflow-hidden">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF]">
        
        <header class="flex items-center justify-between px-5 pt-12 pb-3 flex-shrink-0 z-20 relative cascade-enter" style="animation-delay: 0.1s;">
            <button onclick="handleBack()" class="icon-btn -ml-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1 class="text-[18px] font-bold tracking-wide absolute left-1/2 -translate-x-1/2">猫咪图鉴</h1>
            <button class="icon-btn -mr-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 4v16m8-8H4"></path>
                </svg>
            </button>
        </header>

        <div class="px-5 pb-4 flex gap-3 items-center flex-shrink-0 z-20 cascade-enter" style="animation-delay: 0.2s;">
            <div class="flex-1 bg-white rounded-full flex items-center px-4 py-2.5 shadow-sm border border-white/50 focus-within:border-[#4FBFFF] transition-colors">
                <svg class="w-4 h-4 text-gray-400 mr-2" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="search-input" oninput="filterCards(this.value)" placeholder="输入猫咪名字..." class="bg-transparent w-full text-[13px] text-gray-700 placeholder-gray-400" />
            </div>
            <button class="w-[42px] h-[42px] bg-white rounded-[14px] flex items-center justify-center shadow-sm text-gray-600 active:scale-90 transition-transform border border-white/50">
                <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                </svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-5 pb-20 pt-2 perspective-container" id="grid-container">
            <div class="grid grid-cols-1 gap-5">
                
                <div class="cat-card-wrapper cascade-enter" data-name="小橘" style="animation-delay: 0.3s;">
                    <div class="tilt-card bg-[#F8FAFC]/90 backdrop-blur-md rounded-3xl p-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white">
                        <img src="xiaoju.webp" alt="Cat" class="w-full h-[160px] object-cover rounded-2xl shadow-sm pointer-events-none">
                        
                        <div class="mt-4 flex justify-between items-center px-1">
                            <h2 class="text-[22px] font-bold text-gray-900 tracking-wide">小橘</h2>
                            <div class="flex gap-2">
                                <span class="tag-blue">3岁</span>
                                <span class="tag-yellow">女</span>
                            </div>
                        </div>
                        
                        <div class="flex gap-2 mt-3 px-1">
                            <span class="tag-yellow">活泼开朗</span>
                            <span class="tag-yellow">亲人友善</span>
                            <span class="tag-outline">已绝育</span>
                        </div>
                        
                        <p class="text-gray-400 text-[12px] mt-4 leading-relaxed px-1 font-medium">
                            品种：英国短毛猫<br>
                            小橘是一只性格温顺友好，非常非常与人互动的一只猫。已完成驱虫，身体健康状态良好。
                        </p>
                        <button class="btn-primary">查看详情</button>
                    </div>
                </div>

                <div class="cat-card-wrapper cascade-enter" data-name="小黑" style="animation-delay: 0.4s;">
                    <div class="tilt-card bg-[#F8FAFC]/90 backdrop-blur-md rounded-3xl p-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white">
                        <img src="naigai.webp" alt="Cat" class="w-full h-[160px] object-cover rounded-2xl shadow-sm pointer-events-none">
                        
                        <div class="mt-4 flex justify-between items-center px-1">
                            <h2 class="text-[22px] font-bold text-gray-900 tracking-wide">奶盖</h2>
                            <div class="flex gap-2">
                                <span class="text-[12px] text-gray-400 font-medium mr-1 mt-0.5">已绝育</span>
                                <span class="tag-blue">2岁</span>
                                <span class="tag-yellow">男</span>
                            </div>
                        </div>
                        
                        <div class="flex gap-2 mt-3 px-1">
                            <span class="tag-yellow">活泼开朗</span>
                            <span class="tag-yellow">亲人友善</span>
                        </div>
                        
                        <p class="text-gray-400 text-[12px] mt-4 leading-relaxed px-1 font-medium">
                            品种：孟买猫混血<br>
                            小黑是一只性格温顺友好，非常非常与人互动的一只猫。已完成驱虫，身体健康状态良好。
                        </p>
                        <button class="btn-primary">查看详情</button>
                    </div>
                </div>

                <div class="cat-card-wrapper cascade-enter" data-name="大壮" style="animation-delay: 0.5s;">
                    <div class="tilt-card bg-[#F8FAFC]/90 backdrop-blur-md rounded-3xl p-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white">
                        <img src="zhimahu.webp" alt="Cat" class="w-full h-[160px] object-cover rounded-2xl shadow-sm pointer-events-none">
                        
                        <div class="mt-4 flex justify-between items-center px-1">
                            <h2 class="text-[22px] font-bold text-gray-900 tracking-wide">芝麻糊</h2>
                            <div class="flex gap-2">
                                <span class="tag-blue">5岁</span>
                                <span class="tag-yellow">男</span>
                            </div>
                        </div>
                        
                        <div class="flex gap-2 mt-3 px-1">
                            <span class="tag-yellow">干饭王</span>
                            <span class="tag-outline">未绝育</span>
                        </div>
                        
                        <p class="text-gray-400 text-[12px] mt-4 leading-relaxed px-1 font-medium">
                            品种：缅因猫<br>
                            体型庞大但内心温柔，最喜欢吃鸡肉罐头。目前正在等待好心人领养。
                        </p>
                        <button class="btn-primary">查看详情</button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // --- 炫技 A: 3D 透视倾斜动效 ---
        const cards = document.querySelectorAll('.tilt-card');
        
        cards.forEach(card => {
            // 鼠标移动时计算角度
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left; // 鼠标相对卡片左侧位置
                const y = e.clientY - rect.top;  // 鼠标相对卡片顶部位置
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                // 限制最大倾斜角度为 8 度
                const rotateX = ((y - centerY) / centerY) * -8;
                const rotateY = ((x - centerX) / centerX) * 8;
                
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                card.style.boxShadow = `${-rotateY}px ${rotateX}px 20px rgba(0,0,0,0.1)`;
            });
            
            // 鼠标离开时平滑复位
            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)`;
                card.style.boxShadow = `0 8px 30px rgba(0,0,0,0.04)`;
            });
        });

        // --- 炫技 C: 客户端动态平滑过滤 ---
        function filterCards(term) {
            const searchTerm = term.toLowerCase().trim();
            const wrappers = document.querySelectorAll('.cat-card-wrapper');
            
            wrappers.forEach(wrapper => {
                const name = wrapper.dataset.name.toLowerCase();
                
                if (name.includes(searchTerm)) {
                    // 显示逻辑：恢复高度、缩放和透明度
                    wrapper.style.height = wrapper.scrollHeight + 'px'; // 显式设置高度触发动画
                    wrapper.style.opacity = '1';
                    wrapper.style.transform = 'scale(1)';
                    wrapper.style.marginBottom = '1.25rem'; // tailwind gap-5 (20px)
                    
                    // 动画结束后将高度设为 auto，防止内部内容变化被截断
                    setTimeout(() => { 
                        if(wrapper.style.opacity === '1') wrapper.style.height = 'auto'; 
                    }, 400);
                } else {
                    // 隐藏逻辑：先固定当前高度，再压缩到 0
                    if(wrapper.style.height === 'auto' || !wrapper.style.height) {
                        wrapper.style.height = wrapper.scrollHeight + 'px';
                        wrapper.offsetHeight; // 强制重排 (Reflow) 使初始高度生效
                    }
                    wrapper.style.height = '0px';
                    wrapper.style.opacity = '0';
                    wrapper.style.transform = 'scale(0.8)';
                    wrapper.style.marginBottom = '0px';
                }
            });
        }

        // --- 返回逻辑 ---
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 300);
        }
    </script>
</body>
</html>
