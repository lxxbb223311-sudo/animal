<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>论坛 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 页面切换动画 */
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 0.5; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes slideOutLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-30%); opacity: 0.5; } }
        @keyframes slideInLeft { from { transform: translateX(-30%); opacity: 0.5; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-left { animation: slideOutLeft 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-fade-in { animation: fadeIn 0.3s ease forwards; }
        .page-fade-out { animation: fadeOut 0.3s ease forwards; }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input { -webkit-tap-highlight-color: transparent; outline: none; }
        button, div { -webkit-tap-highlight-color: transparent; }

        /* 炫技：级联上浮淡入动画 */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .feed-item {
            opacity: 0; /* 初始隐藏，由 animation-delay 驱动 */
            animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* 炫技：双击/点击点赞的心跳动效 */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        .like-active svg {
            animation: heartbeat 0.5s ease-in-out forwards;
            color: #ef4444; /* tailwind red-500 */
            fill: #ef4444;
        }
        
        /* 图片轻按暗化反馈 */
        .img-press-effect:active { filter: brightness(0.9); transition: filter 0.1s; }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF]">

        <header class="sticky top-0 z-40 bg-[#E6F2FF]/90 backdrop-blur-xl px-5 pt-[env(safe-area-inset-top)] pb-2 flex-shrink-0">
            <div class="pt-10 pb-2">
                <div class="bg-white rounded-full flex items-center px-4 py-2 border border-white/60 shadow-sm transition-all focus-within:shadow-md">
                    <svg class="w-[18px] h-[18px] text-gray-400 mr-2 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" placeholder="输入内容" class="bg-transparent w-full text-[14px] text-gray-800 placeholder-gray-400" />
                </div>

                <div class="flex justify-between items-center mt-5 px-3 relative">
                    <div id="tab-0" class="text-[17px] font-bold text-gray-900 transition-colors" onclick="switchTab(0)">推荐</div>
                    <div id="tab-1" class="text-[17px] font-medium text-gray-400 transition-colors" onclick="transitionTo('forum-following.html', 'fade')">关注</div>
                    <div id="tab-2" class="text-[17px] font-medium text-gray-400 transition-colors cursor-pointer active:scale-95" onclick="transitionTo('forum-publish.html', 'slideLeft')">发布</div>
                    
                    <div id="tab-indicator" class="absolute -bottom-[8px] left-[16px] w-[26px] h-[3px] bg-[#4FBFFF] rounded-full transition-transform duration-300 ease-out"></div>
                </div>
            </div>
        </header>

        <div id="feed-container" class="flex-1 overflow-y-auto hide-scrollbar px-5 pt-4 pb-[100px] flex flex-col gap-6">
            </div>

        <nav class="fixed bottom-0 w-full max-w-[400px] bg-white rounded-t-[24px] shadow-[0_-4px_20px_rgba(0,0,0,0.03)] pb-[calc(0.8rem+env(safe-area-inset-bottom))] pt-2.5 px-8 flex justify-between items-center z-50">
            <button onclick="transitionTo('dashboard.html')" class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-gray-400" fill="currentColor" viewBox="0 0 24 24"><path d="M11.47 3.84a.75.75 0 011.06 0l8.99 9a.75.75 0 11-1.04 1.08l-1.48-1.48V20.5a.75.75 0 01-.75.75h-4.5a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-1.5a.75.75 0 00-.75.75v4.5a.75.75 0 01-.75.75H5.25a.75.75 0 01-.75-.75v-8.06l-1.48 1.48a.75.75 0 11-1.04-1.08l8.99-9z"></path></svg>
                <span class="text-[10px] font-medium text-gray-400">首页</span>
            </button>
            
            <button class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-[#4FBFFF]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
                <span class="text-[10px] font-bold text-[#4FBFFF]">论坛</span>
            </button>
            
            <button onclick="transitionTo('shop.html', 'fade')" class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
                <span class="text-[10px] font-medium text-gray-400">商城</span>
            </button>
            
            <button onclick="transitionTo('profile.html', 'fade')" class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium text-gray-400">个人中心</span>
            </button>
        </nav>
    </main>

    <script>
        // --- 1. 高阶动效：动态 Tab 滑动切换指示器 ---
        function switchTab(index) {
            const indicator = document.getElementById('tab-indicator');
            // 计算位移 (根据实际排版间距微调)
            const offsets = [0, 115, 235]; 
            indicator.style.transform = `translateX(${offsets[index]}px)`;

            // 字体加粗颜色切换
            for (let i = 0; i < 3; i++) {
                const tab = document.getElementById(`tab-${i}`);
                if (i === index) {
                    tab.classList.replace('text-gray-400', 'text-gray-900');
                    tab.classList.replace('font-medium', 'font-bold');
                } else {
                    tab.classList.replace('text-gray-900', 'text-gray-400');
                    tab.classList.replace('font-bold', 'font-medium');
                }
            }
        }

        // --- 2. 模拟真实数据的 JSON 数组 ---
        const feedData = [
            {
                id: 101,
                user: { name: '小红', avatar: 'https://api.dicebear.com/7.x/adventurer/svg?seed=xiaohong' },
                time: '1小时前',
                isFollowed: false,
                cat: { name: '小橘', age: '3岁', gender: '女' },
                text: '今天在学校门前看到了小橘，感觉呆呆的',
                image: 'xiaoju.webp',
                stats: { likes: 100, comments: 100, stars: 100 },
                isLiked: false
            },
            {
                id: 102,
                user: { name: '小黄', avatar: 'https://api.dicebear.com/7.x/adventurer/svg?seed=xiaohuang' },
                time: '1小时前',
                isFollowed: false,
                cat: { name: '小黑', age: '2岁', gender: '男' },
                text: '拍一张小黑',
                image: 'zhimahu.webp',
                stats: { likes: 100, comments: 100, stars: 100 },
                isLiked: false
            },
            {
                id: 103,
                user: { name: '喵星人', avatar: 'https://api.dicebear.com/7.x/adventurer/svg?seed=miaoxingren' },
                time: '2小时前',
                isFollowed: true, // 默认已关注测试
                cat: { name: '奶盖', age: '1岁', gender: '女' },
                text: '午后阳光下的奶盖，简直不要太美！快来围观~',
                image: 'naigai.webp',
                stats: { likes: 256, comments: 45, stars: 89 },
                isLiked: false
            }
        ];

        // --- 3. 炫技级：纯 JS 模板驱动渲染 Feed 流 (加入本地数据融合) ---
        function renderFeed() {
            const container = document.getElementById('feed-container');
            let html = '';

            let mergedData = [...feedData];
            try {
                const localPosts = JSON.parse(localStorage.getItem('local_published_posts')) || [];
                mergedData = [...localPosts, ...mergedData];
            } catch (e) {
                console.error("解析本地发布数据失败", e);
            }

            mergedData.forEach((item, index) => {
                // 关注按钮状态判断
                let followBtnHTML = '';
                if (item.isFollowed) {
                    followBtnHTML = `<button id="follow-btn-${item.id}" onclick="toggleFollow(${item.id})" class="border-transparent bg-gray-200 text-gray-500 rounded-full px-[14px] py-[4px] text-[12px] font-bold transition-all">已关注</button>`;
                } else {
                    followBtnHTML = `<button id="follow-btn-${item.id}" onclick="toggleFollow(${item.id})" class="border border-[#F1C84B] text-[#F1C84B] bg-white rounded-full px-[14px] py-[4px] text-[12px] font-bold active:scale-90 transition-all">+ 关注</button>`;
                }

                // 级联动画延迟 (每条多延迟 0.1s)
                const delay = index * 0.1;

                html += `
                <div class="feed-item bg-transparent" style="animation-delay: ${delay}s;">
                    <div class="flex items-center justify-between mb-3 px-1">
                        <div class="flex items-center gap-2.5">
                            <img src="${item.user.avatar}" class="w-10 h-10 rounded-full bg-white border border-white shadow-sm object-cover">
                            <div class="flex flex-col justify-center">
                                <span class="text-[15px] font-bold text-gray-800">${item.user.name}</span>
                                <span class="text-[11px] text-gray-500">${item.time}</span>
                            </div>
                        </div>
                        ${followBtnHTML}
                    </div>
                    
                    <div onclick="goToDetail(${item.id})" class="cursor-pointer">
                        <div class="w-full h-[200px] rounded-[16px] overflow-hidden mb-3 shadow-sm img-press-effect">
                            <img src="${item.image}" class="w-full h-full object-cover pointer-events-none">
                        </div>
                        <div class="flex items-center gap-2 mb-2 px-1">
                            <span class="text-[14px] font-bold text-gray-800">${item.cat.name}</span>
                            <span class="bg-[#4FBFFF] text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${item.cat.age}</span>
                            <span class="bg-[#F1C84B] text-gray-800 text-[10px] font-bold px-2 py-0.5 rounded-full">${item.cat.gender}</span>
                        </div>
                        <p class="text-[14px] text-gray-800 leading-snug mb-3.5 px-1">${item.text}</p>
                    </div>

                    <div class="flex items-center gap-8 text-gray-600 px-1">
                        <div id="like-wrap-${item.id}" class="flex items-center gap-1.5 cursor-pointer active:scale-90 transition-transform" onclick="toggleLike(${item.id})">
                            <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            <span id="like-count-${item.id}" class="text-[14px] font-medium">${item.stats.likes}</span>
                        </div>
                        <div class="flex items-center gap-1.5 cursor-pointer active:opacity-70 transition-opacity">
                            <svg class="w-[20px] h-[20px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                            <span class="text-[14px] font-medium">${item.stats.comments}</span>
                        </div>
                        <div class="flex items-center gap-1.5 cursor-pointer active:opacity-70 transition-opacity">
                            <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                            <span class="text-[14px] font-medium">${item.stats.stars}</span>
                        </div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- 4. 微交互：关注状态机切换 ---
        function toggleFollow(id) {
            const btn = document.getElementById(`follow-btn-${id}`);
            const item = feedData.find(d => d.id === id);
            
            if (!item.isFollowed) {
                // 变更为已关注状态
                item.isFollowed = true;
                btn.textContent = '已关注';
                btn.className = 'border-transparent bg-gray-200 text-gray-500 rounded-full px-[14px] py-[4px] text-[12px] font-bold transition-all';
            } else {
                // 取消关注，恢复黄框白底
                item.isFollowed = false;
                btn.textContent = '+ 关注';
                btn.className = 'border border-[#F1C84B] text-[#F1C84B] bg-white rounded-full px-[14px] py-[4px] text-[12px] font-bold active:scale-90 transition-all';
            }
        }

        // --- 5. 微交互：双击/点击的心跳点赞动效 ---
        function toggleLike(id) {
            const wrap = document.getElementById(`like-wrap-${id}`);
            const countSpan = document.getElementById(`like-count-${id}`);
            const item = feedData.find(d => d.id === id);

            if (!item.isLiked) {
                item.isLiked = true;
                item.stats.likes += 1;
                countSpan.textContent = item.stats.likes;
                wrap.classList.add('like-active');
            } else {
                item.isLiked = false;
                item.stats.likes -= 1;
                countSpan.textContent = item.stats.likes;
                wrap.classList.remove('like-active');
            }
        }

        // --- 帖子详情跳转 ---
        function goToDetail(id) {
            const main = document.getElementById('app-main');
            main.classList.add('page-leave-left');
            setTimeout(() => {
                window.location.href = `forum-detail.html?id=${id}`;
            }, 300);
        }

        // --- 页面平滑跳转逻辑 ---
        function transitionTo(url, mode = 'slide') {
            const main = document.getElementById('app-main');
            if(mode === 'fade') {
                main.classList.add('page-fade-out');
                setTimeout(() => {
                    window.location.href = url;
                }, 300);
            } else {
                // 如果返回首页，则向右滑出；否则向左推入
                if(url.includes('dashboard')) {
                    main.classList.remove('page-enter');
                    main.classList.add('page-leave');
                } else {
                    main.classList.add('page-leave-left');
                }
                setTimeout(() => {
                    window.location.href = url;
                }, 300); 
            }
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderFeed();
        });
    </script>
</body>
</html>
