<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>商城 - 流浪喵之家</title>
    
    <script src="https://cdn.tailwindcss.com" defer></script>
    
    <style>
        /* 页面切换动画 */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 0.5; } to { transform: translateX(100%); opacity: 0; } }
        
        .page-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .page-fade-out { animation: fadeOut 0.25s ease-out forwards; }
        .page-leave-right { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { -webkit-tap-highlight-color: transparent; outline: none; }

        /* 炫技 B：级联丝滑出场 (Fade-up Stagger) */
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .stagger-item {
            opacity: 0;
            animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
        }

        /* 炫技 C1：购物车物理回弹特效 */
        @keyframes cartBounce {
            0% { transform: scale(1); }
            40% { transform: scale(0.6); }
            70% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .animate-cart-bounce {
            animation: cartBounce 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 炫技 C2：+1 气泡向上飘散淡出 */
        @keyframes floatUpFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-45px) scale(1.6); opacity: 0; }
        }
        .bubble-plus-one {
            position: absolute;
            color: #F1C84B;
            font-weight: 900;
            font-size: 16px;
            pointer-events: none;
            z-index: 100;
            animation: floatUpFade 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            text-shadow: 0 2px 4px rgba(241, 200, 75, 0.3);
        }

        /* 炫技 D：图片 Hover 呼吸感（适配移动端按压） */
        .img-breathe { transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .product-card:active .img-breathe { transform: scale(1.08); }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-fade-in bg-[#E6F2FF]">

        <header class="sticky top-0 z-40 bg-[#E6F2FF]/80 backdrop-blur-xl px-6 pt-[calc(env(safe-area-inset-top)+24px)] pb-3 flex-shrink-0 transition-all border-b border-transparent" id="header">
            <h1 class="text-[24px] font-extrabold text-gray-900 tracking-wide">商城</h1>
        </header>

        <div id="scroll-container" class="flex-1 overflow-y-auto hide-scrollbar px-5 pt-2 pb-[110px] flex flex-col relative z-10" onscroll="handleScroll()">
            
            <div class="w-full h-[140px] rounded-[24px] overflow-hidden relative shadow-sm stagger-item mb-3 bg-white" style="animation-delay: 0.05s;">
                <img src="微信图片_20260510043348.png" fetchpriority="high" class="w-full h-full object-cover">
                <div class="absolute top-4 left-5">
                    <span class="text-[22px] font-black text-gray-900 drop-shadow-md">主食</span>
                </div>
            </div>

            <div class="flex gap-3 mb-6">
                <div class="w-1/2 h-[85px] rounded-[20px] overflow-hidden relative shadow-sm stagger-item bg-white cursor-pointer active:scale-95 transition-transform" style="animation-delay: 0.1s;">
                    <img src="微信图片_20260510043353.png" decoding="async" class="w-full h-full object-cover">
                    <div class="absolute top-3 left-4">
                        <span class="text-[18px] font-black text-gray-800 drop-shadow-sm">零食</span>
                    </div>
                </div>
                <div class="w-1/2 h-[85px] rounded-[20px] overflow-hidden relative shadow-sm stagger-item bg-white cursor-pointer active:scale-95 transition-transform" style="animation-delay: 0.15s;">
                    <img src="微信图片_20260510043351.png" decoding="async" class="w-full h-full object-cover">
                    <div class="absolute top-3 left-4">
                        <span class="text-[18px] font-black text-gray-800 drop-shadow-sm">周边</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col w-full">
                <h2 class="text-[18px] font-bold text-gray-900 mb-4 stagger-item" style="animation-delay: 0.2s;">精选好物</h2>
                
                <div id="product-grid" class="grid grid-cols-2 gap-x-3 gap-y-4">
                    </div>
            </div>

        </div>

        <div id="floating-cart" onclick="transitionTo('cart.html', 'slideLeft')" class="fixed right-6 bottom-[100px] w-14 h-14 bg-white/80 backdrop-blur-md shadow-[0_8px_20px_rgba(0,0,0,0.1)] rounded-full flex items-center justify-center border border-white z-40 cursor-pointer transition-transform">
            <div id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full shadow-sm scale-0 transition-transform duration-300">0</div>
            <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        </div>

        <nav class="fixed bottom-0 w-full max-w-[400px] bg-white rounded-t-[24px] shadow-[0_-4px_20px_rgba(0,0,0,0.03)] pb-[calc(0.8rem+env(safe-area-inset-bottom))] pt-2.5 px-8 flex justify-between items-center z-50">
            <button onclick="transitionTo('dashboard.html', 'slideRight')" class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-gray-400" fill="currentColor" viewBox="0 0 24 24"><path d="M11.47 3.84a.75.75 0 011.06 0l8.99 9a.75.75 0 11-1.04 1.08l-1.48-1.48V20.5a.75.75 0 01-.75.75h-4.5a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-1.5a.75.75 0 00-.75.75v4.5a.75.75 0 01-.75.75H5.25a.75.75 0 01-.75-.75v-8.06l-1.48 1.48a.75.75 0 11-1.04-1.08l8.99-9z"></path></svg>
                <span class="text-[10px] font-medium text-gray-400">首页</span>
            </button>
            
            <button onclick="transitionTo('forum.html', 'fade')" class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
                <span class="text-[10px] font-medium text-gray-400">论坛</span>
            </button>
            
            <button class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-[#4FBFFF]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-bold text-[#4FBFFF]">商城</span>
            </button>
            
            <button onclick="transitionTo('profile.html', 'fade')" class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium text-gray-400">个人中心</span>
            </button>
        </nav>
    </main>

    <script>
        const productList = [
            { id: 1, name: '喵趣主食', attr: '主食', desc: '易于消化', price: '100.00', image: '微信图片_20260510043343.png' },
            { id: 2, name: '喵趣小食', attr: '零食', desc: '蛋白质高', price: '50.00', image: '微信图片_20260510043341.png' },
            { id: 3, name: '喵咪鱼条', attr: '零食', desc: '加拿大进口', price: '130.00', image: '微信图片_20260510043346.png' },
            { id: 4, name: '喵咪鲜鱼小吃', attr: '零食', desc: '新鲜三文鱼', price: '80.00', image: '微信图片_20260510043320.png' }
        ];

        function initCart() {
            const cart = JSON.parse(localStorage.getItem('my_cart_items')) || [];
            const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
            updateCartBadge(totalQty);
        }

        function updateCartBadge(num) {
            const badge = document.getElementById('cart-badge');
            if (num > 0) {
                badge.textContent = num;
                badge.style.transform = 'scale(1)';
            } else {
                badge.style.transform = 'scale(0)';
            }
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            let html = '';

            productList.forEach((prod, index) => {
                const delay = 0.25 + (index * 0.1);

                // 【优化】通过 loading="lazy" decoding="async" 对非首屏的瀑布流图片进行延迟加载和异步解码
                html += `
                <div class="product-card bg-white rounded-[22px] p-2 pb-3 shadow-[0_4px_15px_rgba(0,0,0,0.02)] flex flex-col stagger-item cursor-pointer border border-white" style="animation-delay: ${delay}s;">
                    <div class="w-full aspect-[4/3] rounded-[16px] overflow-hidden relative bg-gray-50 mb-2.5">
                        <img src="${prod.image}" alt="${prod.name}" loading="lazy" decoding="async" class="img-breathe w-full h-full object-cover">
                    </div>
                    
                    <div class="px-1.5 flex flex-col flex-1">
                        <h3 class="text-[14px] font-bold text-gray-800 leading-snug line-clamp-1">${prod.name}</h3>
                        <span class="text-[11px] text-gray-400 mt-0.5 line-clamp-1">${prod.desc}</span>
                        
                        <div class="mt-auto pt-3 flex items-center justify-between">
                            <span class="text-[16px] font-bold text-[#F1C84B]">
                                <span class="text-[12px]">￥</span>${prod.price}
                            </span>
                            
                            <button onclick="addToCart(event, this, ${prod.id})" class="w-7 h-7 flex items-center justify-center text-[#F1C84B] rounded-full active:bg-yellow-50 transition-colors shrink-0">
                                <svg class="w-[20px] h-[20px]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
                `;
            });

            grid.innerHTML = html;
        }

        function addToCart(event, btnElement, productId) {
            event.stopPropagation();

            let cart = JSON.parse(localStorage.getItem('my_cart_items')) || [];
            const prod = productList.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...prod, quantity: 1, selected: false });
            }
            localStorage.setItem('my_cart_items', JSON.stringify(cart));
            
            const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
            updateCartBadge(totalQty);

            const floatingCart = document.getElementById('floating-cart');
            floatingCart.classList.remove('animate-cart-bounce');
            void floatingCart.offsetWidth;
            floatingCart.classList.add('animate-cart-bounce');

            btnElement.classList.remove('animate-cart-bounce');
            void btnElement.offsetWidth;
            btnElement.classList.add('animate-cart-bounce');

            const rect = btnElement.getBoundingClientRect();
            const bubble = document.createElement('div');
            bubble.innerText = '+1';
            bubble.className = 'bubble-plus-one';
            bubble.style.left = (rect.left + rect.width / 2 - 8) + 'px';
            bubble.style.top = (rect.top - 5) + 'px';
            document.body.appendChild(bubble);

            setTimeout(() => bubble.remove(), 700);
        }

        function handleScroll() {
            const container = document.getElementById('scroll-container');
            const header = document.getElementById('header');
            if (container.scrollTop > 10) {
                header.classList.add('border-white/50', 'shadow-sm');
                header.classList.remove('border-transparent');
            } else {
                header.classList.remove('border-white/50', 'shadow-sm');
                header.classList.add('border-transparent');
            }
        }

        function transitionTo(url, mode = 'fade') {
            const main = document.getElementById('app-main');
            if (mode === 'fade') {
                main.classList.remove('page-fade-in');
                main.classList.add('page-fade-out');
            } else if (mode === 'slideRight') {
                main.classList.remove('page-fade-in');
                main.classList.add('page-leave-right');
            } else if (mode === 'slideLeft') {
                main.classList.remove('page-fade-in');
                main.classList.add('page-leave-right');
            }
            
            setTimeout(() => {
                window.location.href = url;
            }, 250); 
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            initCart();
        });
    </script>
</body>
</html>
