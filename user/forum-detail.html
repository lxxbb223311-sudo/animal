<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>帖子详情 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 原生 SPA 级平滑切换动画 */
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 0.5; } to { transform: translateX(100%); opacity: 0; } }
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input, button, div { -webkit-tap-highlight-color: transparent; outline: none; }

        /* 心跳点赞动效 */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        .like-active svg {
            animation: heartbeat 0.5s ease-in-out forwards;
            color: #ef4444; fill: #ef4444;
        }

        /* 炫技 C：底部输入框丝滑膨胀逻辑。基于 group-focus-within 利用原生 CSS 解决 JS 状态延迟问题 */
        .bottom-bar-icons { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); width: 140px; }
        .bottom-bar-send { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); width: 0; opacity: 0; transform: translateX(20px); pointer-events: none;}
        
        .input-group:focus-within .bottom-bar-icons { width: 0; opacity: 0; transform: scale(0.8) translateX(20px); gap: 0; pointer-events: none;}
        .input-group:focus-within .bottom-bar-send { width: 70px; opacity: 1; transform: translateX(0); pointer-events: auto;}
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF] shadow-xl">

        <header class="sticky top-0 z-40 bg-[#E6F2FF]/95 backdrop-blur-xl px-5 pt-[env(safe-area-inset-top)] pb-3 flex-shrink-0 border-b border-white/50">
            <div class="pt-10 flex items-center justify-between relative">
                <button onclick="handleBack()" class="p-2 -ml-2 active:scale-90 transition-transform text-gray-900 z-10">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h1 class="text-[17px] font-bold tracking-wide text-gray-900 absolute left-1/2 -translate-x-1/2">详情</h1>
                <button class="p-2 -mr-2 active:scale-90 transition-transform text-gray-900 z-10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto hide-scrollbar pb-[90px]">
            
            <div id="post-content" class="px-5 pt-4 pb-6">
                </div>

            <div class="bg-[#F8FAFC] rounded-t-[24px] min-h-[50vh] shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
                <div class="px-5 py-4 border-b border-gray-200/60 sticky top-0 bg-[#F8FAFC]/95 backdrop-blur-md z-10 rounded-t-[24px]">
                    <h3 id="comment-count-title" class="text-[14px] font-bold text-gray-800">共 0 条评论</h3>
                </div>
                
                <div id="comments-list" class="px-5 py-4 flex flex-col gap-5">
                    </div>
            </div>

        </div>

        <div class="input-group fixed bottom-0 w-full max-w-[400px] bg-white/95 backdrop-blur-xl px-4 pt-3 pb-[calc(0.8rem+env(safe-area-inset-bottom))] flex items-center justify-between shadow-[0_-4px_20px_rgba(0,0,0,0.04)] z-50 border-t border-gray-100/50">
            <div class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 flex items-center transition-all duration-300 border border-transparent focus-within:bg-white focus-within:border-[#4FBFFF]/40 focus-within:shadow-[0_2px_10px_rgba(79,191,255,0.1)]">
                <svg class="w-4 h-4 text-gray-400 mr-2 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                <input type="text" placeholder="一起来讨论讨论" class="bg-transparent w-full outline-none text-[14px] text-gray-800 placeholder-gray-400">
            </div>
            
            <div class="bottom-bar-icons flex items-center justify-end gap-5 text-gray-600 shrink-0">
                <div id="detail-like-btn" class="flex items-center gap-1.5 active:scale-90 transition-transform cursor-pointer ml-4" onclick="toggleDetailLike()">
                    <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    <span id="detail-like-count" class="text-[14px] font-bold">0</span>
                </div>
                <div class="flex items-center gap-1.5 active:opacity-70 transition-opacity">
                    <svg class="w-[20px] h-[20px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    <span id="detail-comment-count" class="text-[14px] font-bold">0</span>
                </div>
                <div class="flex items-center gap-1.5 active:opacity-70 transition-opacity">
                    <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                </div>
            </div>

            <button class="bottom-bar-send bg-[#4FBFFF] text-white rounded-full py-2 text-[14px] font-bold shadow-md active:scale-95 ml-2">
                发送
            </button>
        </div>

    </main>

    <script>
        // --- A. 炫技级强壮数据模拟与动态路由 (Mock Dynamic Routing) ---
        const postDatabase = {
            "101": {
                id: 101,
                user: { name: '小红', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=xiaohong' },
                time: '1小时前',
                timestamp: '2026-05-08 17:00:45',
                isFollowed: false,
                text: '今天在学校门前看到了小橘，感觉呆呆的。不知道是不是昨天没睡好，还是想要罐头了呢？它在阳光下毛发金灿灿的，特别治愈。',
                image: 'xiaoju.png',
                stats: { likes: 100, comments: 2, stars: 45 },
                isLiked: false,
                comments: [
                    {
                        id: 1, author: '喵星人', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=miaoxingren', text: '小橘确实很可爱！我也经常在花坛那边看到它。', time: '50分钟前', likes: 12,
                        replies: [
                            { id: 2, author: '小红', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=xiaohong', text: '对呀对呀，胖乎乎的，特别好撸。', time: '45分钟前' },
                            { id: 3, author: '铲屎官A', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=chanshi', text: '下次去我也带点冻干给它。', time: '30分钟前' }
                        ]
                    },
                    {
                        id: 4, author: '爱猫者', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=aimao', text: '这光线拍得真好，橘猫就是坠神的！', time: '10分钟前', likes: 5,
                        replies: []
                    }
                ]
            },
            "201": {
                id: 201,
                user: { name: '小黄', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=xiaohuang' },
                time: '昨天 14:30',
                timestamp: '2026-05-07 14:30:12',
                isFollowed: true,
                text: '拍一张小黑，它今天心情好像不错哦~ 眼睛睁得大大的，像两颗黄宝石。',
                image: 'zhimahu.png',
                stats: { likes: 356, comments: 1, stars: 120 },
                isLiked: true,
                comments: [
                    {
                        id: 5, author: '养猫指南', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=zhinan', text: '黑猫真的很帅气，就是晚上容易找不到哈哈。', time: '昨天 15:00', likes: 88,
                        replies: []
                    }
                ]
            }
        };

        // 当前页面的帖子数据状态
        let currentPost = null;

        document.addEventListener('DOMContentLoaded', () => {
            // 获取 URL 参数 id，实现简单动态路由
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id') || '101'; // 默认取101作为 Fallback

            // 鲁棒性检查：如果库里没有，默认拿第一条
            currentPost = postDatabase[postId] || postDatabase['101'];

            renderPostDetail();
            renderComments();
            initBottomBar();
        });

        // --- 渲染正文区域 ---
        function renderPostDetail() {
            const container = document.getElementById('post-content');
            
            const followBtnHtml = currentPost.isFollowed 
                ? `<button onclick="toggleFollow()" id="detail-follow-btn" class="border-transparent bg-gray-200 text-gray-500 rounded-full px-4 py-[5px] text-[12px] font-bold transition-all">已关注</button>`
                : `<button onclick="toggleFollow()" id="detail-follow-btn" class="border border-[#F1C84B] text-[#F1C84B] bg-white rounded-full px-4 py-[5px] text-[12px] font-bold active:scale-90 transition-all">+ 关注</button>`;

            container.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <img src="${currentPost.user.avatar}" class="w-[42px] h-[42px] rounded-full bg-white border-2 border-white shadow-sm object-cover">
                        <div class="flex flex-col justify-center">
                            <span class="text-[16px] font-bold text-gray-900">${currentPost.user.name}</span>
                            <span class="text-[12px] text-gray-500 mt-0.5">${currentPost.time}</span>
                        </div>
                    </div>
                    ${followBtnHtml}
                </div>

                <p class="text-[15px] text-gray-800 leading-relaxed mb-3">${currentPost.text}</p>
                <div class="w-full rounded-[18px] overflow-hidden shadow-sm border border-white/50 mb-3">
                    <img src="${currentPost.image}" class="w-full h-auto object-cover">
                </div>
                
                <div class="text-[11px] text-gray-400 font-medium tracking-wide">
                    发布于 ${currentPost.timestamp}
                </div>
            `;
        }

        // --- B. 炫技级：嵌套评论递归渲染 (Recursive Comment Rendering) ---
        function renderComments() {
            // 更新标题计数
            let totalComments = currentPost.comments.length;
            currentPost.comments.forEach(c => { totalComments += c.replies.length; });
            document.getElementById('comment-count-title').textContent = `共 ${totalComments} 条评论`;
            document.getElementById('detail-comment-count').textContent = totalComments;

            const container = document.getElementById('comments-list');
            
            // 递归渲染核心逻辑
            const commentsHtml = currentPost.comments.map(comment => {
                
                // 渲染嵌套的子评论 (如果有)
                let repliesHtml = '';
                if (comment.replies && comment.replies.length > 0) {
                    repliesHtml = `
                    <div class="mt-2.5 bg-gray-100/70 rounded-xl p-3 flex flex-col gap-2.5">
                        ${comment.replies.map(reply => `
                            <div class="flex items-start gap-2">
                                <img src="${reply.avatar}" class="w-6 h-6 rounded-full bg-white shrink-0 object-cover">
                                <div class="flex flex-col flex-1">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-[12px] font-bold text-gray-700">${reply.author}</span>
                                        <span class="text-[10px] text-gray-400">${reply.time}</span>
                                    </div>
                                    <span class="text-[13px] text-gray-800 leading-snug mt-0.5">${reply.text}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>`;
                }

                // 父级评论 DOM
                return `
                <div class="flex items-start gap-3">
                    <img src="${comment.avatar}" class="w-9 h-9 rounded-full bg-white shadow-sm shrink-0 object-cover border border-gray-100">
                    
                    <div class="flex-1 border-b border-gray-200/50 pb-4">
                        <div class="flex justify-between items-start">
                            <div class="flex flex-col">
                                <span class="text-[13px] font-bold text-gray-700">${comment.author}</span>
                                <span class="text-[10px] text-gray-400 mt-0.5">${comment.time}</span>
                            </div>
                            <div class="flex items-center gap-1 text-gray-400 cursor-pointer active:scale-90 transition-transform">
                                <svg class="w-[16px] h-[16px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                <span class="text-[12px] font-medium">${comment.likes}</span>
                            </div>
                        </div>
                        
                        <p class="text-[14px] text-gray-800 leading-relaxed mt-1">${comment.text}</p>
                        
                        ${repliesHtml}
                    </div>
                </div>`;
            }).join('');

            container.innerHTML = commentsHtml;
        }

        // --- 初始化底部状态栏数据 ---
        function initBottomBar() {
            document.getElementById('detail-like-count').textContent = currentPost.stats.likes;
            if (currentPost.isLiked) {
                document.getElementById('detail-like-btn').classList.add('like-active');
            }
        }

        // --- 交互：详情页独立点赞 ---
        function toggleDetailLike() {
            const btn = document.getElementById('detail-like-btn');
            const count = document.getElementById('detail-like-count');
            
            if (!currentPost.isLiked) {
                currentPost.isLiked = true;
                currentPost.stats.likes += 1;
                count.textContent = currentPost.stats.likes;
                btn.classList.add('like-active');
            } else {
                currentPost.isLiked = false;
                currentPost.stats.likes -= 1;
                count.textContent = currentPost.stats.likes;
                btn.classList.remove('like-active');
            }
        }

        // --- 交互：关注状态切换 ---
        function toggleFollow() {
            const btn = document.getElementById('detail-follow-btn');
            if (!currentPost.isFollowed) {
                currentPost.isFollowed = true;
                btn.textContent = '已关注';
                btn.className = 'border-transparent bg-gray-200 text-gray-500 rounded-full px-4 py-[5px] text-[12px] font-bold transition-all';
            } else {
                currentPost.isFollowed = false;
                btn.textContent = '+ 关注';
                btn.className = 'border border-[#F1C84B] text-[#F1C84B] bg-white rounded-full px-4 py-[5px] text-[12px] font-bold active:scale-90 transition-all';
            }
        }

        // --- 交互：返回上一页 ---
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave');
            setTimeout(() => {
                window.history.back(); // 丝滑返回历史
            }, 300); 
        }
    </script>
</body>
</html>
