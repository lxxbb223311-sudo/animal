<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>芝麻糊的详情 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: '0b5a5bb27d5def7d96f6f7c479cf6e73',
        }
    </script>
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=d2ec38a441edd52a5587ad34007333a9"></script>
    
    <style>
        /* 原生 SPA 级平滑切换动画 */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 0.5; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 防止手势拖拽时触发系统默认滚动 */
        .touch-action-none { touch-action: none; }
        ::-webkit-scrollbar { display: none; }

        /* 高德地图 Logo 与版权信息隐藏 */
        .amap-logo, .amap-copyright { display: none !important; }
        
        /* 虚拟猫咪定位标识雷达水波纹 */
        @keyframes radarPing {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .animate-radar-ping {
            animation: radarPing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF] shadow-2xl overflow-hidden">
        
        <div class="absolute top-[env(safe-area-inset-top)] left-0 w-full px-5 pt-6 flex justify-between z-50 pointer-events-none">
            <button onclick="handleBack()" class="pointer-events-auto w-[38px] h-[38px] rounded-full bg-white/30 backdrop-blur-md flex items-center justify-center text-white shadow-sm active:scale-90 transition-transform border border-white/20">
                <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <button class="pointer-events-auto w-[38px] h-[38px] rounded-full bg-white/30 backdrop-blur-md flex items-center justify-center text-white shadow-sm active:scale-90 transition-transform border border-white/20">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"></path></svg>
            </button>
        </div>

        <div class="fixed top-0 w-full max-w-[400px] h-[50vh] z-0">
            <img src="zhimahu.png" class="w-full h-full object-cover" alt="Hero Cat">
        </div>

        <div id="drag-container" class="absolute top-[45vh] w-full h-[100vh] flex flex-col z-10 touch-action-none">
            
            <div class="absolute -top-4 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-white/60 rounded-full shadow-sm z-50"></div>

            <div id="info-card" class="bg-[#E6F2FF] rounded-t-[30px] w-full px-6 pt-10 pb-5 shrink-0 relative shadow-[0_-10px_30px_rgba(0,0,0,0.1)]">
                <div class="absolute -top-7 left-6 w-14 h-14 rounded-full border-[3px] border-[#E6F2FF] shadow-sm overflow-hidden bg-white">
                    <img src="zhimahu.png" class="w-full h-full object-cover" alt="Avatar">
                </div>

                <div class="flex items-center gap-3 mb-2">
                    <h1 class="text-[20px] font-bold text-gray-900 tracking-wide">芝麻糊</h1>
                    <span class="px-2.5 py-0.5 bg-[#4FBFFF] text-white text-[11px] font-bold rounded-full">1岁</span>
                    <span class="px-2.5 py-0.5 bg-[#F1C84B] text-gray-800 text-[11px] font-bold rounded-full">男</span>
                </div>
                
                <h2 class="text-[14px] font-bold text-gray-700 mb-2">简介</h2>
                <p class="text-[13px] text-gray-500 leading-relaxed mb-4">
                    安静温顺，喜欢踩奶贴贴。英短蓝猫，性格有些小内向，但只要你拿出零食，它就会立刻化身粘人精。
                </p>

                <div class="flex items-center gap-1.5 text-gray-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"></path></svg>
                    <span class="text-[13px] font-bold tracking-wide">南京工业职业技术大学天堂校区</span>
                </div>
            </div>

            <div class="w-full flex-1 relative bg-gray-100">
                <div id="amap-container" style="position: absolute; top:0; left: 0; width: 100%; height: 100%;"></div>
                
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-30 pointer-events-none flex flex-col items-center justify-center">
                    <div class="relative flex items-center justify-center">
                        <div class="absolute w-[80px] h-[80px] bg-[#4FBFFF]/30 rounded-full animate-radar-ping"></div>
                        <div class="absolute w-[50px] h-[50px] bg-[#4FBFFF]/40 rounded-full animate-radar-ping" style="animation-delay: 1s;"></div>
                        
                        <div class="w-[56px] h-[56px] bg-white rounded-full p-[2px] shadow-[0_5px_15px_rgba(0,0,0,0.2)] relative z-10 border-[3px] border-[#4FBFFF]">
                            <img src="zhimahu.png" class="w-full h-full rounded-full object-cover" alt="Cat Marker">
                        </div>
                    </div>
                </div>

                <div class="absolute bottom-12 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md px-5 py-2.5 rounded-full shadow-[0_8px_20px_rgba(0,0,0,0.15)] flex items-center gap-2 border border-white z-20">
                    <div class="relative w-3 h-3 flex items-center justify-center">
                        <div class="absolute w-full h-full bg-[#4FBFFF] rounded-full animate-ping opacity-60"></div>
                        <div class="relative w-2 h-2 bg-[#4FBFFF] rounded-full"></div>
                    </div>
                    <span class="text-[13px] font-bold text-gray-800 tracking-wide">当前位置：花园</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- 物理级手势拖拽全屏阻尼交互 ---
        const dragContainer = document.getElementById('drag-container');
        const infoCard = document.getElementById('info-card');
        const vh = window.innerHeight;
        const maxDragY = -vh * 0.45; 

        let startY = 0;
        let currentY = 0;
        let isDragging = false;
        let isFullScreen = false;

        dragContainer.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
            dragContainer.style.transition = 'none';
            infoCard.style.transition = 'none';
        });

        dragContainer.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const y = e.touches[0].clientY;
            const deltaY = y - startY;

            let targetY = isFullScreen ? maxDragY + deltaY : deltaY;

            if (targetY > 0) targetY = targetY * 0.2; 
            if (targetY < maxDragY) targetY = maxDragY + (targetY - maxDragY) * 0.2; 

            currentY = targetY;
            dragContainer.style.transform = `translateY(${currentY}px)`;

            let opacity = 1 - (Math.abs(currentY) / Math.abs(maxDragY));
            if (opacity < 0) opacity = 0;
            if (opacity > 1) opacity = 1;
            
            infoCard.style.opacity = opacity;
            if (opacity < 0.2) {
                infoCard.style.height = '0px';
                infoCard.style.padding = '0px';
            } else {
                infoCard.style.height = 'auto';
                infoCard.style.padding = '40px 24px 20px 24px';
            }
        });

        dragContainer.addEventListener('touchend', () => {
            isDragging = false;
            dragContainer.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
            infoCard.style.transition = 'opacity 0.4s ease, height 0.4s ease, padding 0.4s ease';

            if (!isFullScreen && currentY < -50) {
                isFullScreen = true;
                dragContainer.style.transform = `translateY(${maxDragY}px)`;
                infoCard.style.opacity = 0;
                infoCard.style.height = '0px';
                infoCard.style.padding = '0px';
            } else if (isFullScreen && currentY > maxDragY + 50) {
                isFullScreen = false;
                dragContainer.style.transform = `translateY(0px)`;
                infoCard.style.opacity = 1;
                infoCard.style.height = 'auto';
                infoCard.style.padding = '40px 24px 20px 24px';
            } else {
                dragContainer.style.transform = `translateY(${isFullScreen ? maxDragY : 0}px)`;
                infoCard.style.opacity = isFullScreen ? 0 : 1;
            }
        });

        // --- 高精度地图与随机漫步算法 ---
        document.addEventListener('DOMContentLoaded', () => {
            const initialLng = 118.833012;
            const initialLat = 32.018629;
            let targetLng = initialLng;
            let targetLat = initialLat;
            
            const map = new AMap.Map('amap-container', {
                center: [targetLng, targetLat],
                zoom: 17,
                mapStyle: 'amap://styles/normal',
                showLabel: true
            });

            const maxDistance = 0.008;
            let angle = Math.random() * Math.PI * 2;
            setInterval(() => {
                angle += (Math.random() - 0.5) * Math.PI / 4;
                const step = 0.00025;
                const newLng = targetLng + Math.cos(angle) * step;
                const newLat = targetLat + Math.sin(angle) * step;
                
                const deltaLng = newLng - initialLng;
                const deltaLat = newLat - initialLat;
                const distance = Math.sqrt(deltaLng * deltaLng + deltaLat * deltaLat);
                
                if (distance <= maxDistance) {
                    targetLng = newLng;
                    targetLat = newLat;
                } else {
                    angle = Math.atan2(initialLat - targetLat, initialLng - targetLng);
                }
                
                map.panTo([targetLng, targetLat]);
            }, 2000);
        });

        // --- 丝滑返回转场 ---
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave');
            setTimeout(() => {
                window.location.href = 'dashboard.html?from=detail';
            }, 300); 
        }
    </script>
</body>
</html>
