<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>账号登录 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 页面级切换动画 */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 0.5; }
            to { transform: translateX(100%); opacity: 0; }
        }
        @keyframes slideOutLeft {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(-100%); opacity: 0; }
        }
        .page-enter {
            animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .page-leave {
            animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .page-leave-left {
            animation: slideOutLeft 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 覆盖浏览器默认的输入框交互样式 */
        input {
            -webkit-tap-highlight-color: transparent;
        }
        input:focus {
            outline: none;
        }
        input::placeholder {
            color: #C0C4CC;
            font-weight: normal;
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col px-8 page-enter bg-[#E6F2FF]">

        <header class="pt-14 pb-2 flex-shrink-0">
            <button onclick="handleBack()" class="p-2 -ml-2 transition-transform active:scale-90 text-gray-900">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
        </header>

        <div class="flex-1 flex flex-col pt-6 pb-32 justify-center relative z-10">
            <h1 class="text-[26px] font-bold text-gray-900 mb-12 tracking-wide">
                账号登录
            </h1>

            <div class="flex flex-col gap-8 w-full">
                <div class="border-b border-[#D6DCE5] focus-within:border-gray-500 transition-colors pb-3 flex items-center">
                    <input type="text" id="login-user" placeholder="请输入用户名" class="w-full bg-transparent text-[16px] text-gray-900 font-medium" />
                </div>

                <div class="border-b border-[#D6DCE5] focus-within:border-gray-500 transition-colors pb-3 flex items-center">
                    <input type="password" id="login-pass" placeholder="请输入密码 " class="w-full bg-transparent text-[16px] text-gray-900 font-medium" />
                </div>
            </div>

            <button onclick="handleLogin()" class="w-full bg-[#4FBFFF] hover:bg-[#3daeee] mt-12 py-[14px] rounded-full text-[17px] font-bold tracking-widest shadow-sm transition-transform duration-200 active:scale-95 flex items-center justify-center text-gray-800">
                登录
            </button>
        </div>
    </main>

    <script>
        // 平滑返回首页门户
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300); 
        }

        // 登录核心逻辑 (读取本地注册信息验证)
        function handleLogin() {
            const userVal = document.getElementById('login-user').value.trim();
            const passVal = document.getElementById('login-pass').value.trim();

            if (!userVal || !passVal) {
                alert('请输入用户名和密码！');
                return;
            }

            // 获取通过 register.html 注册进来的用户列表
            const users = JSON.parse(localStorage.getItem('user_list')) || [];
            
            // 校验机制：通用账号 user/user 或者 匹配 localStorage 里的账号
            const isValid = (userVal === 'user' && passVal === 'user') || 
                            users.some(u => u.username === userVal && u.password === passVal);

            if (isValid) {
                // 验证成功：存入 session
                localStorage.setItem('current_session_user', userVal);
                
                // 执行向左平滑退出的动画并跳转 Dashboard
                const main = document.getElementById('app-main');
                main.classList.remove('page-enter');
                main.classList.add('page-leave-left');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 300);
            } else {
                alert('账号或密码错误');
            }
        }
    </script>
</body>
</html>
