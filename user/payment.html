<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>付款 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 原生 SPA 级平滑切换动画 */
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 0.5; } to { transform: translateX(100%); opacity: 0; } }
        
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-right { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { -webkit-tap-highlight-color: transparent; }

        /* 炫技 C：自定义 SVG 丝滑单选动画 */
        .radio-circle {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid #E5E7EB; /* 默认灰边 */
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .radio-item.active .radio-circle {
            border-color: #F1C84B; /* 选中黄边 */
            background-color: #F1C84B;
        }
        .radio-circle path {
            stroke-dasharray: 20; 
            stroke-dashoffset: 20; /* 初始隐藏 */
            transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .radio-item.active .radio-circle path {
            stroke-dashoffset: 0; /* 选中时丝滑画出对号 */
        }

        /* 支付成功 Toast 动画 */
        @keyframes toastPop {
            0% { transform: translate(-50%, 20px) scale(0.9); opacity: 0; }
            10% { transform: translate(-50%, 0) scale(1.05); opacity: 1; }
            15% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            90% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -20px) scale(0.9); opacity: 0; }
        }
        .toast-show {
            animation: toastPop 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#F1C84B] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF]">

        <header class="pt-[env(safe-area-inset-top)] pb-3 flex-shrink-0 z-40 relative">
            <div class="pt-8 px-5 flex items-center justify-between relative">
                <button onclick="handleBack()" class="p-2 -ml-2 active:scale-90 transition-transform text-gray-900 z-10">
                    <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h1 class="text-[18px] font-bold tracking-wide text-gray-900 absolute left-1/2 -translate-x-1/2">付款</h1>
                <div class="w-6"></div> </div>
        </header>

        <div class="flex flex-col items-center justify-center mt-6 mb-10 flex-shrink-0">
            <div class="text-[12px] text-gray-500 font-medium mb-3 flex items-center gap-1">
                支付剩余时间 <span id="countdown-display" class="font-bold tabular-nums">15:00</span>
            </div>
            <div class="flex items-baseline text-gray-900">
                <span class="text-[24px] font-medium mr-0.5">￥</span>
                <span id="amount-display" class="text-[44px] font-black tracking-tight tabular-nums">0.00</span>
            </div>
        </div>

        <div class="px-5 flex-1 flex flex-col">
            <h2 class="text-[14px] font-medium text-gray-800 mb-4">支付方式</h2>
            
            <div class="flex flex-col gap-5">
                <div class="radio-item flex items-center justify-between cursor-pointer active:opacity-70 transition-opacity" onclick="selectMethod('wechat')">
                    <div class="flex items-center gap-3">
                        <svg class="w-7 h-7 text-[#05C160]" viewBox="0 0 1024 1024" fill="currentColor">
                            <path d="M682.666667 298.666667c-174.933333 0-316.8 116.266667-316.8 259.2 0 76.8 40.533333 147.2 106.666666 195.2-12.8 38.4-40.533333 80-40.533333 80s55.466667-5.333333 108.8-30.933334c44.8 11.733333 86.4 16 141.866667 16 174.933333 0 316.8-116.266667 316.8-259.2s-141.866667-260.266667-316.8-260.266666z m-91.733334 144c18.133333 0 33.066667 14.933333 33.066667 33.066666s-14.933333 33.066667-33.066667 33.066667-33.066667-14.933333-33.066666-33.066667 14.933333-33.066667 33.066666-33.066666z m178.133334 66.133333c-18.133333 0-33.066667-14.933333-33.066667-33.066666s14.933333-33.066667 33.066667-33.066667 33.066667 14.933333 33.066666 33.066667-14.933333 33.066667-33.066666 33.066666z" fill="#05C160"></path>
                            <path d="M371.2 560c0 4.266667-2.133333 8.533333-2.133333 12.8 123.733333 0 225.066667-96 225.066666-213.333333C594.133333 241.066667 472.533333 145.066667 348.8 145.066667c-123.733333 0-225.066667 96-225.066667 214.4 0 62.933333 32 119.466667 86.4 158.933333-10.666667 30.933333-33.066667 65.066667-33.066666 65.066667s44.8-4.266667 87.466666-25.6c36.266667 10.666667 69.333333 13.866667 114.133334 13.866666-2.133333-4.266667-7.466667-7.466667-7.466667-11.733333z" fill="#05C160"></path>
                        </svg>
                        <span class="text-[15px] font-medium text-gray-800">微信支付</span>
                    </div>
                    <div class="radio-circle">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                </div>

                <div class="radio-item active flex items-center justify-between cursor-pointer active:opacity-70 transition-opacity" onclick="selectMethod('alipay')">
                    <div class="flex items-center gap-3">
                        <svg class="w-7 h-7 text-[#1677FF]" viewBox="0 0 1024 1024" fill="currentColor">
                            <path d="M896 512c0 212.074667-171.925333 384-384 384S128 724.074667 128 512 299.925333 128 512 128s384 171.925333 384 384z" fill="#1677FF"></path>
                            <path d="M725.333333 586.666667s-108.8-19.2-181.333333-149.333334c44.8-59.733333 70.4-123.733333 83.2-183.466666h-115.2V213.333333h-51.2v40.533334H334.933333v49.066666h253.866667C571.733333 349.866667 539.733333 403.2 497.066667 448H324.266667v49.066667h130.133333c-29.866667 36.266667-74.666667 68.266667-142.933333 91.733333l21.333333 46.933333c87.466667-27.733333 147.2-70.4 187.733333-125.866666 40.533333 76.8 119.466667 125.866667 187.733334 130.133333l17.066666-53.333333z" fill="#FFFFFF"></path>
                        </svg>
                        <span class="text-[15px] font-medium text-gray-800">支付宝支付</span>
                    </div>
                    <div class="radio-circle">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <div class="px-6 pb-[calc(2rem+env(safe-area-inset-bottom))] flex-shrink-0 z-50">
            <button id="pay-btn" onclick="executePayment()" class="w-full bg-[#F1C84B] text-gray-900 text-[16px] font-bold rounded-full py-[14px] shadow-[0_4px_15px_rgba(241,200,75,0.4)] active:scale-95 transition-all flex justify-center items-center gap-2">
                <span>立即支付</span>
            </button>
        </div>

        <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/80 backdrop-blur-sm text-white px-6 py-3 rounded-xl shadow-lg z-[100] text-[15px] font-medium opacity-0 pointer-events-none flex items-center gap-2">
            <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
            付款成功
        </div>

    </main>

    <script>
        let countdownTimer;
        let timeLeft = 900; // 15分钟 = 900秒

        // --- A. URL 路由参数解析与防御 ---
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const amountStr = params.get('amount');
            
            // 防御编程：如果被人恶意删除参数或非数字，拦截打回
            if (!amountStr || isNaN(parseFloat(amountStr))) {
                alert('订单数据异常，请返回重新结算！');
                window.location.href = 'shop.html';
                return;
            }

            // 触发 CountUp 数字自增特效
            const targetAmount = parseFloat(amountStr);
            animateCountUp(targetAmount);

            // 启动倒计时
            startCountdown();
        });

        // --- 炫技：CountUp 金额动效 ---
        function animateCountUp(target) {
            const el = document.getElementById('amount-display');
            let current = 0;
            const duration = 800; // 动画时长 0.8秒
            const interval = 20; // 帧率
            const step = target / (duration / interval);

            const timer = setInterval(() => {
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                el.innerText = current.toFixed(2);
            }, interval);
        }

        // --- B. 真实精准倒计时引擎 ---
        function startCountdown() {
            const el = document.getElementById('countdown-display');
            countdownTimer = setInterval(() => {
                timeLeft--;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    el.innerText = "00:00";
                    // 倒计时结束禁用支付
                    const btn = document.getElementById('pay-btn');
                    btn.disabled = true;
                    btn.innerHTML = "订单已超时";
                    btn.classList.add('opacity-50', 'pointer-events-none');
                    return;
                }
                
                const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                const s = String(timeLeft % 60).padStart(2, '0');
                el.innerText = `${m}:${s}`;
            }, 1000);
        }

        // --- C. SVG 单选框状态机 ---
        function selectMethod(method) {
            const items = document.querySelectorAll('.radio-item');
            items.forEach(item => {
                // 点击微信时，索引0加上active，索引1去掉active；点击支付宝反之。
                if (method === 'wechat') {
                    items[0].classList.add('active');
                    items[1].classList.remove('active');
                } else {
                    items[0].classList.remove('active');
                    items[1].classList.add('active');
                }
            });
        }

        // --- D. 支付成功生命周期闭环 ---
        function executePayment() {
            const btn = document.getElementById('pay-btn');
            if (btn.disabled) return;
            
            // 阶段 1：Loading 状态
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin w-5 h-5 text-gray-800" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>支付中...</span>
            `;

            // 阶段 2：延迟模拟网络请求
            setTimeout(() => {
                clearInterval(countdownTimer);
                const toast = document.getElementById('toast');
                toast.classList.add('toast-show');
                btn.classList.replace('bg-[#F1C84B]', 'bg-[#10B981]');
                btn.classList.replace('text-gray-900', 'text-white');
                btn.innerHTML = `<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg><span>已完成</span>`;

                const currentCheckout = JSON.parse(localStorage.getItem('current_checkout')) || [];
                if (currentCheckout.length > 0) {
                    let myOrders = JSON.parse(localStorage.getItem('my_orders')) || [];
                    let totalCents = 0;
                    currentCheckout.forEach(i => totalCents += Math.round(parseFloat(i.price) * 100) * i.quantity);
                    
                    const newOrder = {
                        orderId: 'SN' + Date.now(),
                        date: new Date().toLocaleString('zh-CN', { hour12: false }).substring(0, 16),
                        status: '已完成',
                        items: currentCheckout,
                        total: (totalCents / 100).toFixed(2)
                    };
                    myOrders.unshift(newOrder);
                    localStorage.setItem('my_orders', JSON.stringify(myOrders));

                    let cart = JSON.parse(localStorage.getItem('my_cart_items')) || [];
                    const checkoutIds = currentCheckout.map(i => i.id);
                    cart = cart.filter(i => !checkoutIds.includes(i.id));
                    localStorage.setItem('my_cart_items', JSON.stringify(cart));
                    
                    localStorage.removeItem('current_checkout');
                }

                setTimeout(() => {
                    const main = document.getElementById('app-main');
                    main.classList.remove('page-enter');
                    main.classList.add('page-leave-right');
                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 300);
                }, 1000);
            }, 1500);
        }

        // --- 路由取消返回 ---
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave-right');
            setTimeout(() => {
                window.location.href = 'shop.html';
            }, 300); 
        }
    </script>
</body>
</html>
