<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>关注动态 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 页面切换动画：淡入淡出 (模拟组件级切换) */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .page-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .page-fade-out { animation: fadeOut 0.25s ease-out forwards; }

        /* 隐藏滚动条但保留功能 */
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input, button, div { -webkit-tap-highlight-color: transparent; outline: none; }

        /* 炫技 A1：级联上浮淡入动画 (用于 Feed 流) */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .feed-item {
            opacity: 0;
            animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
        }

        /* 炫技 A2：横向头像的弹簧级联出场动画 */
        @keyframes springPop {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-item {
            opacity: 0;
            animation: springPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            will-change: transform;
        }

        /* 炫技 C：心跳点赞动效 */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        .like-active svg {
            animation: heartbeat 0.5s ease-in-out forwards;
            color: #ef4444; fill: #ef4444;
        }

        /* 图片轻按暗化反馈 */
        .img-press-effect:active { filter: brightness(0.9); transition: filter 0.1s; }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-fade-in bg-[#E6F2FF]">

        <header class="sticky top-0 z-40 bg-[#E6F2FF]/95 backdrop-blur-xl px-5 pt-[env(safe-area-inset-top)] pb-2 flex-shrink-0">
            <div class="pt-10 pb-2">
                <div class="bg-white rounded-full flex items-center px-4 py-2 border border-white/60 shadow-sm transition-all focus-within:shadow-md focus-within:border-[#4FBFFF]/30">
                    <svg class="w-[18px] h-[18px] text-gray-400 mr-2 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" placeholder="输入内容" class="bg-transparent w-full text-[14px] text-gray-800 placeholder-gray-400" />
                </div>

                <div class="flex justify-between items-center mt-5 px-3 relative">
                    <div class="text-[17px] font-medium text-gray-400 transition-colors cursor-pointer active:scale-95" onclick="transitionTo('forum.html', 'fade')">推荐</div>
                    <div class="text-[17px] font-bold text-gray-900 transition-colors">关注</div>
                    <div class="text-[17px] font-medium text-gray-400 transition-colors cursor-pointer active:scale-95">发布</div>
                    
                    <div class="absolute -bottom-[8px] left-[16px] w-[26px] h-[3px] bg-[#4FBFFF] rounded-full transform translate-x-[115px]"></div>
                </div>
            </div>
        </header>

        <div class="w-full flex-shrink-0 border-b border-white/40 mb-2">
            <div id="following-avatars" class="flex gap-4 overflow-x-auto hide-scrollbar snap-x snap-mandatory px-5 py-3">
                </div>
        </div>

        <div id="feed-container" class="flex-1 overflow-y-auto hide-scrollbar px-5 pt-2 pb-[100px] flex flex-col gap-8">
            </div>

        <nav class="fixed bottom-0 w-full max-w-[400px] bg-white rounded-t-[24px] shadow-[0_-4px_20px_rgba(0,0,0,0.03)] pb-[calc(0.8rem+env(safe-area-inset-bottom))] pt-2.5 px-8 flex justify-between items-center z-50">
            <button onclick="transitionTo('dashboard.html', 'slideRight')" class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-gray-400" fill="currentColor" viewBox="0 0 24 24"><path d="M11.47 3.84a.75.75 0 011.06 0l8.99 9a.75.75 0 11-1.04 1.08l-1.48-1.48V20.5a.75.75 0 01-.75.75h-4.5a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-1.5a.75.75 0 00-.75.75v4.5a.75.75 0 01-.75.75H5.25a.75.75 0 01-.75-.75v-8.06l-1.48 1.48a.75.75 0 11-1.04-1.08l8.99-9z"></path></svg>
                <span class="text-[10px] font-medium text-gray-400">首页</span>
            </button>
            
            <button class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-[#4FBFFF]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
                <span class="text-[10px] font-bold text-[#4FBFFF]">论坛</span>
            </button>
            
            <button class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span class="text-[10px] font-medium text-gray-400">商城</span>
            </button>
            
            <button class="flex flex-col items-center gap-1 group w-12 active:scale-90 transition-transform">
                <svg class="w-[22px] h-[22px] text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium text-gray-400">个人中心</span>
            </button>
        </nav>
    </main>

    <script>
        // --- 1. 横向已关注好友数据 ---
        const followingUsers = [
            { id: 1, name: '小红', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=xiaohong' },
            { id: 2, name: '小黄', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=xiaohuang' },
            { id: 3, name: '喵星人', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=miaoxingren' },
            { id: 4, name: '铲屎官A', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=chanshi' },
            { id: 5, name: '养猫指南', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=zhinan' },
            { id: 6, name: '爱猫者', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=aimao' }
        ];

        // --- 2. Feed 流数据 (精准复原设计稿信息结构) ---
        const followingFeedData = [
            {
                id: 201,
                user: { name: '小红', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=xiaohong', age: '21岁', gender: '女' },
                time: '1分钟前',
                text: '今天在学校门前看到了小橘，感觉呆呆的',
                image: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=600&auto=format&fit=crop',
                stats: { likes: 100, comments: 100, stars: 100 },
                likedByAvatars: [
                    'https://api.dicebear.com/7.x/adventurer/svg?seed=a1',
                    'https://api.dicebear.com/7.x/adventurer/svg?seed=a2',
                    'https://api.dicebear.com/7.x/adventurer/svg?seed=a3'
                ],
                isLiked: false
            },
            {
                id: 202,
                user: { name: '小黄', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=xiaohuang', age: '20岁', gender: '女' },
                time: '1小时前',
                text: '拍一张小黑，它今天心情好像不错哦~',
                image: 'https://images.unsplash.com/photo-1573865526739-10659fec78a5?q=80&w=600&auto=format&fit=crop',
                stats: { likes: 124, comments: 12, stars: 45 },
                likedByAvatars: [
                    'https://api.dicebear.com/7.x/adventurer/svg?seed=b1',
                    'https://api.dicebear.com/7.x/adventurer/svg?seed=b2',
                    'https://api.dicebear.com/7.x/adventurer/svg?seed=b3'
                ],
                isLiked: true // 默认已点赞测试
            },
            {
                id: 203,
                user: { name: '喵星人', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=miaoxingren', age: '19岁', gender: '男' },
                time: '昨天 14:30',
                text: '遇到一只超可爱的蓝猫，疯狂蹭我的裤腿！',
                image: 'https://images.unsplash.com/photo-1543852786-1cf6624b9987?q=80&w=600&auto=format&fit=crop',
                stats: { likes: 356, comments: 88, stars: 120 },
                likedByAvatars: [
                    'https://api.dicebear.com/7.x/adventurer/svg?seed=c1',
                    'https://api.dicebear.com/7.x/adventurer/svg?seed=c2',
                    'https://api.dicebear.com/7.x/adventurer/svg?seed=c3'
                ],
                isLiked: false
            }
        ];

        // --- 渲染顶部横向头像流 ---
        function renderAvatars() {
            const container = document.getElementById('following-avatars');
            let html = '';
            followingUsers.forEach((user, index) => {
                // 延迟参数，产生像弹簧一样的连续弹出效果
                const delay = index * 0.08;
                html += `
                    <div class="snap-center shrink-0 flex flex-col items-center gap-1.5 pop-item cursor-pointer" style="animation-delay: ${delay}s;">
                        <div class="w-[52px] h-[52px] rounded-full bg-white p-[2px] shadow-[0_4px_10px_rgba(0,0,0,0.06)] active:scale-90 transition-transform">
                            <img src="${user.avatar}" class="w-full h-full rounded-full object-cover border border-gray-100">
                        </div>
                        <span class="text-[11px] text-gray-600 font-medium">${user.name}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // --- 渲染 Feed 流核心 ---
        function renderFollowingFeed() {
            const container = document.getElementById('feed-container');
            let html = '';

            followingFeedData.forEach((item, index) => {
                const delay = index * 0.15; // 级联淡入延迟

                // 炫技 B：Avatar Group 堆叠头像渲染
                const avatarGroupHtml = item.likedByAvatars.map(url => `
                    <img class="w-[22px] h-[22px] rounded-full ring-[2.5px] ring-[#E6F2FF] bg-white object-cover" src="${url}" />
                `).join('');

                const heartIconClass = item.isLiked ? 'like-active' : '';

                html += `
                <div class="feed-item bg-transparent" style="animation-delay: ${delay}s;">
                    
                    <div class="flex items-start justify-between mb-3 px-1">
                        <div class="flex items-center gap-3">
                            <img src="${item.user.avatar}" class="w-11 h-11 rounded-full bg-white border-[2px] border-white shadow-sm object-cover">
                            <div class="flex flex-col justify-center">
                                <span class="text-[16px] font-bold text-gray-900 mb-0.5">${item.user.name}</span>
                                <div class="flex items-center gap-1.5">
                                    <span class="bg-[#4FBFFF] text-white text-[9px] font-bold px-2 py-0.5 rounded-full">${item.user.age}</span>
                                    <span class="bg-[#F1C84B] text-gray-800 text-[9px] font-bold px-2 py-0.5 rounded-full">${item.user.gender}</span>
                                </div>
                            </div>
                        </div>
                        <span class="text-[12px] text-gray-400 font-medium mt-1">${item.time}</span>
                    </div>
                    
                    <div class="w-full h-[210px] rounded-[18px] overflow-hidden mb-3.5 shadow-sm img-press-effect border border-white/40">
                        <img src="${item.image}" class="w-full h-full object-cover">
                    </div>

                    <p class="text-[14px] text-gray-800 leading-relaxed mb-4 px-1">${item.text}</p>

                    <div class="flex items-center justify-between px-1">
                        
                        <div class="flex items-center">
                            <div class="flex -space-x-2 mr-2">
                                ${avatarGroupHtml}
                            </div>
                            <span class="text-[11px] text-gray-500 font-medium">等人赞过</span>
                        </div>

                        <div class="flex items-center gap-5 text-gray-600">
                            <div id="like-wrap-${item.id}" class="flex items-center gap-1 cursor-pointer active:scale-90 transition-transform ${heartIconClass}" onclick="toggleLike(${item.id})">
                                <svg class="w-[20px] h-[20px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                <span id="like-count-${item.id}" class="text-[13px] font-bold">${item.stats.likes}</span>
                            </div>
                            <div class="flex items-center gap-1 cursor-pointer active:opacity-70 transition-opacity">
                                <svg class="w-[19px] h-[19px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                <span class="text-[13px] font-bold">${item.stats.comments}</span>
                            </div>
                            <div class="flex items-center gap-1 cursor-pointer active:opacity-70 transition-opacity">
                                <svg class="w-[20px] h-[20px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                                <span class="text-[13px] font-bold">${item.stats.stars}</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="w-full h-[1px] bg-white/50 mb-2 mt-2"></div>
                `;
            });

            container.innerHTML = html;
        }

        // --- 点赞状态切换 (心跳特效) ---
        function toggleLike(id) {
            const wrap = document.getElementById(`like-wrap-${id}`);
            const countSpan = document.getElementById(`like-count-${id}`);
            const item = followingFeedData.find(d => d.id === id);

            if (!item.isLiked) {
                item.isLiked = true;
                item.stats.likes += 1;
                countSpan.textContent = item.stats.likes;
                wrap.classList.add('like-active');
            } else {
                item.isLiked = false;
                item.stats.likes -= 1;
                countSpan.textContent = item.stats.likes;
                wrap.classList.remove('like-active');
            }
        }

        // --- 自定义页面平滑路由 ---
        function transitionTo(url, effect = 'fade') {
            const main = document.getElementById('app-main');
            
            if (effect === 'fade') {
                // Tab 级别切换，使用淡出
                main.classList.remove('page-fade-in');
                main.classList.add('page-fade-out');
            } else if (effect === 'slideRight') {
                // 退回首页等主入口，使用向右推走动画
                main.style.animation = "slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards";
            }
            
            setTimeout(() => {
                window.location.href = url;
            }, 250); 
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderAvatars();
            renderFollowingFeed();
        });
    </script>
</body>
</html>
