<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>流浪喵之家 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 统一补充页面平滑退出的动画 */
        @keyframes slideOutLeft {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(-100%); opacity: 0; }
        }
        .page-leave-left {
            animation: slideOutLeft 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .custom-radio {
            appearance: none;
            -webkit-appearance: none;
            width: 1.125rem;
            height: 1.125rem;
            border: 1px solid #4B5563;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .custom-radio:checked::before {
            content: '';
            width: 0.6rem;
            height: 0.6rem;
            background-color: #4FBFFF;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex items-center justify-center font-sans antialiased overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="home-main" class="w-full max-w-[400px] min-h-screen sm:min-h-[800px] flex flex-col items-center justify-center px-6 py-10 relative bg-[#E6F2FF]">
        
        <div class="w-48 h-48 bg-white rounded-3xl overflow-hidden shadow-sm flex-shrink-0 mb-6">
            <img src="ScreenShot_2026-05-18_142828_042.webp" alt="流浪喵之家" class="w-full h-full object-cover" />
        </div>

        <h1 class="text-[22px] font-bold text-gray-900 tracking-[0.05em] mb-12 text-center">
            欢迎来到流浪喵之家
        </h1>

        <div class="w-full flex flex-col gap-4">
            <button onclick="handleWeChatLogin()" class="w-full bg-[#4FBFFF] hover:bg-[#3daeee] text-gray-800 flex items-center justify-center gap-2 py-3.5 rounded-full text-[16px] font-medium transition-all duration-200 active:scale-95 shadow-sm">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8.5 14C6.01472 14 4 12.2091 4 10C4 7.79086 6.01472 6 8.5 6C10.9853 6 13 7.79086 13 10C13 10.158 12.9882 10.3138 12.9652 10.4671C12.5028 10.1654 11.9673 10 11.4 10C9.52223 10 8 11.5222 8 13.4C8 13.6062 8.01837 13.808 8.05342 14.0042C8.20014 14.0014 8.34907 14 8.5 14ZM19 14.5C19 16.433 17.2091 18 15 18C14.4925 18 14.01 17.9048 13.5707 17.7346L11.5 19L11.8906 17.242C10.7486 16.7118 10 15.6664 10 14.5C10 12.567 12.2386 11 15 11C17.7614 11 20 12.567 20 14.5C20 15.549 19.4673 16.49 18.6364 17.1121L19 18.5L17.2589 17.5818C16.5684 17.8524 15.8037 18 15 18H19V14.5Z"/></svg>
                微信登录
            </button>

            <button onclick="handleQQLogin()" class="w-full bg-[#4FBFFF] hover:bg-[#3daeee] text-gray-800 flex items-center justify-center gap-2 py-3.5 rounded-full text-[16px] font-medium transition-all duration-200 active:scale-95 shadow-sm">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8 2 6 5 6 9.5C6 11.5 6.5 13.5 7.5 15C6.5 15.5 5 16.5 5 18.5C5 19.5 6 21 8.5 21C9.5 21 10.5 20.5 11 20C11.5 20.5 12.5 21 13.5 21C16 21 17 19.5 17 18.5C17 16.5 15.5 15.5 14.5 15C15.5 13.5 16 11.5 16 9.5C16 5 14 2 12 2ZM9 10C9 9.44772 9.44772 9 10 9C10.5523 9 11 9.44772 11 10C11 10.5523 10.5523 11 10 11C9.44772 11 9 10.5523 9 10ZM14 11C13.4477 11 13 10.5523 13 10C13 9.44772 13.4477 9 14 9C14.5523 9 15 9.44772 15 10C15 10.5523 14.5523 11 14 11Z"/></svg>
                QQ登录
            </button>

            <button onclick="handleAdminLogin()" class="w-full bg-[#4FBFFF] hover:bg-[#3daeee] text-gray-800 flex items-center justify-center gap-2 py-3.5 rounded-full text-[16px] font-medium transition-all duration-200 active:scale-95 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 15l2 2m0 0l2-2m-2 2v4"></path></svg>
                管理员登录
            </button>
        </div>

        <div class="mt-5 w-full text-center">
            <button onclick="goToRegister()" class="text-[14px] text-[#4FBFFF] font-semibold hover:underline active:opacity-70 transition-opacity">
                新用户注册
            </button>
        </div>

        <div class="mt-6 flex items-center justify-center">
            <label class="flex items-center gap-2 cursor-pointer group">
                <input type="checkbox" name="agreement" class="custom-radio transition-transform group-active:scale-90">
                <span class="text-[13px] text-gray-800 tracking-wide select-none">
                    我已阅读并同意流浪喵之家协议
                </span>
            </label>
        </div>
    </main>

    <script>
        function checkAgreement() {
            const checkbox = document.querySelector('input[name="agreement"]');
            if (!checkbox || !checkbox.checked) {
                alert('请先阅读并同意流浪喵之家协议');
                return false;
            }
            return true;
        }

        function handleWeChatLogin() {
            if (!checkAgreement()) return;
            alert('微信登录功能开发中');
        }

        function handleQQLogin() {
            if (!checkAgreement()) return;
            alert('QQ登录功能开发中');
        }

        function handleAdminLogin() {
            if (!checkAgreement()) return;
            const main = document.getElementById('home-main');
            main.classList.add('page-leave-left');
            setTimeout(() => {
                window.location.href = 'admin-login.html';
            }, 280);
        }

        function goToRegister() {
            if (!checkAgreement()) return;
            const main = document.getElementById('home-main');
            main.classList.add('page-leave-left');
            setTimeout(() => {
                window.location.href = 'register.html';
            }, 280);
        }
    </script>
</body>
</html>
