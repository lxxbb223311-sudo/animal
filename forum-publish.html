<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>发布动态 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 原生 SPA 级平滑切换动画 */
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 0.5; } to { transform: translateX(100%); opacity: 0; } }
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-right { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        input, textarea, button { -webkit-tap-highlight-color: transparent; outline: none; resize: none; }

        /* 炫技 B：表单验证失败的物理级左右颤动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15%, 45%, 75% { transform: translateX(-6px); }
            30%, 60% { transform: translateX(6px); }
        }
        .shake-animation { animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

        /* 上传框基础虚线动效 */
        .upload-dashed { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='24' ry='24' stroke='%23C0C4CCFF' stroke-width='3' stroke-dasharray='12%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); border-radius: 24px; }
    </style>
</head>
<body class="bg-[#E6F2FF] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#4FBFFF] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#E6F2FF] shadow-2xl">

        <header class="sticky top-0 z-40 bg-[#E6F2FF]/95 backdrop-blur-xl px-5 pt-[env(safe-area-inset-top)] pb-3 flex-shrink-0">
            <div class="pt-10 flex items-center justify-between relative">
                <button onclick="handleBack()" class="p-2 -ml-2 active:scale-90 transition-transform text-gray-900 z-10">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h1 class="text-[17px] font-bold tracking-wide text-gray-900 absolute left-1/2 -translate-x-1/2">发布动态</h1>
                <div class="w-6"></div> </div>
        </header>

        <div class="flex-1 overflow-y-auto hide-scrollbar px-6 pt-2 pb-[120px] flex flex-col">
            
            <div id="text-wrapper" class="w-full transition-all">
                <textarea id="post-text" oninput="autoResize(this)" placeholder="描述一下你的作品，能让更多人看点哦~" class="w-full min-h-[50px] bg-transparent text-[15px] text-gray-800 placeholder-gray-400 leading-relaxed py-2"></textarea>
            </div>

            <div id="image-wrapper" class="w-[180px] h-[180px] mt-6 transition-all">
                <label id="upload-box" class="w-full h-full upload-dashed flex flex-col items-center justify-center cursor-pointer active:scale-[0.98] transition-all bg-white shadow-sm overflow-hidden relative">
                    <div id="upload-placeholder" class="flex flex-col items-center justify-center pointer-events-none">
                        <svg class="w-12 h-12 text-gray-800 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                        <span class="text-[13px] text-gray-400 font-medium tracking-widest mt-2">上传图片</span>
                    </div>
                    <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="previewImage(event)">
                </label>
            </div>

            <div class="mt-10 flex flex-col gap-6 w-full">
                <div class="flex items-center justify-between border-b border-white/50 pb-4">
                    <div class="flex items-center gap-3">
                        <span class="text-[20px]">🐱</span>
                        <span class="text-[15px] font-bold text-gray-800">主角</span>
                    </div>
                    <input type="text" id="cat-name" placeholder="输入猫咪名字" class="text-right bg-transparent text-[14px] text-gray-700 placeholder-gray-400 font-medium outline-none border-none w-32" />
                </div>
            </div>

        </div>

        <div class="fixed bottom-0 w-full max-w-[400px] px-8 pb-[calc(1.5rem+env(safe-area-inset-bottom))] pt-4 bg-gradient-to-t from-[#E6F2FF] via-[#E6F2FF]/95 to-transparent z-50">
            <button id="publish-btn" onclick="publishPost()" class="w-full bg-[#4FBFFF] text-white rounded-full py-[14px] text-[16px] font-bold tracking-widest shadow-[0_4px_15px_rgba(79,191,255,0.3)] active:scale-95 transition-all flex items-center justify-center">
                发布
            </button>
        </div>

    </main>

    <script>
        // 全局存储转化后的 Base64 图片
        let base64ImageString = '';

        // --- 高级功能：文本域自动撑开高度 ---
        function autoResize(textarea) {
            textarea.style.height = 'auto'; // 先归零
            textarea.style.height = textarea.scrollHeight + 'px'; // 根据内容重新设置
        }

        // --- 炫技 A：FileReader 纯前端图片极速预览 ---
        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 限制一下大小防崩溃（非必需，仅作良好实践）
            if (file.size > 5 * 1024 * 1024) {
                alert('图片太大啦，请选择5MB以下的图片！');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                base64ImageString = e.target.result;
                
                // 将原大纲加号去除，替换为图片预览，并去掉虚线边框
                const uploadBox = document.getElementById('upload-box');
                uploadBox.classList.remove('upload-dashed');
                uploadBox.classList.add('border', 'border-white/50');
                uploadBox.innerHTML = `
                    <img src="${base64ImageString}" class="w-full h-full object-cover animate-[fadeIn_0.3s_ease]">
                    <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="previewImage(event)">
                `;
            };
            reader.readAsDataURL(file);
        }

        // --- 炫技 B & C & D：校验颤动 + 状态封存 + 丝滑退场 ---
        function publishPost() {
            const textContent = document.getElementById('post-text').value.trim();
            const catName = document.getElementById('cat-name').value.trim() || '神秘喵星人';
            
            const textWrapper = document.getElementById('text-wrapper');
            const imageWrapper = document.getElementById('image-wrapper');

            // 校验：没写字颤动提示
            if (!textContent) {
                triggerShake(textWrapper);
                document.getElementById('post-text').focus();
                return;
            }
            // 校验：没配图颤动提示
            if (!base64ImageString) {
                triggerShake(imageWrapper);
                return;
            }

            // 获取当前登录人 (如果在 dashboard 没有登录，给个默认)
            const currentUserName = localStorage.getItem('current_session_user') || '我自己';

            // 构造符合 forum.html 中 feedData 格式的新数据结构
            const newPost = {
                id: Date.now(), // 借用时间戳做唯一 ID
                user: { name: currentUserName, avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=' + currentUserName },
                time: '刚刚',
                isFollowed: false,
                cat: { name: catName, age: '未知', gender: '保密' },
                text: textContent,
                image: base64ImageString,
                stats: { likes: 0, comments: 0, stars: 0 },
                isLiked: false
            };

            // 提取本地原有的动态数组
            let localPosts = [];
            try {
                localPosts = JSON.parse(localStorage.getItem('local_published_posts')) || [];
            } catch (error) {
                localPosts = [];
            }

            // 追加到最前面
            localPosts.unshift(newPost);
            
            // 存入 LocalStorage 实现跨页面通信
            localStorage.setItem('local_published_posts', JSON.stringify(localPosts));

            // 丝滑退场动效：按钮变成 Loading 态
            const btn = document.getElementById('publish-btn');
            btn.innerHTML = `
                发布中 
                <svg class="animate-spin ml-2 w-5 h-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            `;
            
            // 停留 0.6 秒给用户安全感，然后向右平滑飞出并返回论坛首页
            setTimeout(() => {
                const main = document.getElementById('app-main');
                main.classList.remove('page-enter');
                main.classList.add('page-leave-right');
                setTimeout(() => {
                    window.location.href = 'forum.html';
                }, 300);
            }, 600);
        }

        // 辅助函数：触发局部物理颤动动画
        function triggerShake(element) {
            element.classList.remove('shake-animation');
            // 触发重绘
            void element.offsetWidth;
            element.classList.add('shake-animation');
        }

        // --- 交互：取消发布，直接返回 ---
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave-right');
            setTimeout(() => {
                window.location.href = 'forum.html';
            }, 300); 
        }
    </script>
</body>
</html>
