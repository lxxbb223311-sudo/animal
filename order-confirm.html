<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>订单确认 - 流浪喵之家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 原生 SPA 级平滑切换动画 */
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 0.5; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes slideOutLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-30%); opacity: 0.5; } }
        
        .page-enter { animation: slideInRight 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-right { animation: slideOutRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .page-leave-left { animation: slideOutLeft 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { -webkit-tap-highlight-color: transparent; }

        /* 炫技 B：内联输入框交互动画 */
        .inline-input {
            border-bottom: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .inline-input:focus {
            border-bottom-color: #F97316; /* Tailwind orange-500 */
            color: #F97316;
            transform: scale(1.02) translateY(-2px);
        }
        .inline-input-right:focus {
            transform: scale(1.02) translateY(-2px);
            transform-origin: right center;
        }

        /* 支付成功 Toast 动画 */
        @keyframes toastPop {
            0% { transform: translate(-50%, 20px) scale(0.9); opacity: 0; }
            10% { transform: translate(-50%, 0) scale(1.05); opacity: 1; }
            15% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            90% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -20px) scale(0.9); opacity: 0; }
        }
        .toast-show {
            animation: toastPop 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#F3F4F6] min-h-screen flex justify-center font-sans antialiased text-gray-800 overflow-hidden selection:bg-[#F97316] selection:text-white">

    <main id="app-main" class="w-full max-w-[400px] h-[100dvh] relative flex flex-col page-enter bg-[#F3F4F6]">

        <header class="sticky top-0 z-40 bg-[#F97316] px-5 pt-[env(safe-area-inset-top)] pb-3 flex-shrink-0 shadow-sm">
            <div class="pt-10 flex items-center justify-between relative">
                <button onclick="handleBack()" class="p-2 -ml-2 active:scale-90 transition-transform text-white z-10">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h1 class="text-[18px] font-bold tracking-wide text-white absolute left-1/2 -translate-x-1/2">订单确认</h1>
                <div class="w-6"></div> </div>
        </header>

        <div class="flex-1 overflow-y-auto hide-scrollbar px-4 pt-4 pb-[100px] flex flex-col gap-4">
            
            <div class="bg-white rounded-[20px] p-5 shadow-sm border border-gray-100 flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-1">
                        <span class="text-[16px] font-bold text-gray-800 shrink-0">收货人：</span>
                        <input type="text" value="喵星人" class="inline-input w-[70px] bg-transparent outline-none text-[16px] font-bold text-gray-800 origin-left" />
                    </div>
                    <input type="tel" value="18999999989" class="inline-input inline-input-right w-[115px] bg-transparent outline-none text-[16px] font-bold text-gray-800 text-right" />
                </div>
                
                <div class="flex items-start gap-2">
                    <svg class="w-5 h-5 text-gray-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <div class="flex-1 text-[13px] text-gray-500 leading-snug">
                        收货地址：中国江苏省南京市秦淮区南京工业职业技术大学
                    </div>
                    <svg class="w-4 h-4 text-gray-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </div>

            <div class="bg-white rounded-[20px] p-4 shadow-sm border border-gray-100 flex flex-col gap-5" id="order-items-container">
                </div>

            <div class="bg-white rounded-[20px] px-5 py-4 shadow-sm border border-gray-100 flex items-center justify-between">
                <span class="text-[15px] font-bold text-gray-800 shrink-0 mr-4">备注</span>
                <input type="text" placeholder="选填，建议留言前先与客服沟通确认" class="flex-1 text-right text-[13px] text-gray-500 bg-transparent outline-none focus:text-gray-800 transition-colors" />
            </div>

        </div>

        <div class="fixed bottom-0 w-full max-w-[400px] h-[calc(3.5rem+env(safe-area-inset-bottom))] bg-white flex z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
            <div class="flex-1 bg-[#FFE0B2] flex items-center px-5 pb-[env(safe-area-inset-bottom)]">
                <span class="text-[13px] text-gray-800 font-bold">需付款：</span>
                <span class="text-[18px] font-bold text-[#F97316] ml-1">
                    <span class="text-[13px]">￥</span><span id="total-price">0.00</span>
                </span>
            </div>
            
            <button id="pay-btn" onclick="processPayment()" class="w-[140px] bg-[#F97316] flex items-center justify-center text-white text-[16px] font-bold tracking-wider active:bg-[#ea580c] transition-colors pb-[env(safe-area-inset-bottom)]">
                <span>去付款</span>
            </button>
        </div>

        <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/80 backdrop-blur-sm text-white px-6 py-3 rounded-lg shadow-lg z-[100] text-[15px] font-medium opacity-0 pointer-events-none flex items-center gap-2">
            <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
            支付成功
        </div>

    </main>

    <script>
        let orderItems = [];

        // --- 路由守卫与数据读取 ---
        document.addEventListener('DOMContentLoaded', () => {
            try {
                orderItems = JSON.parse(localStorage.getItem('current_checkout')) || [];
                
                if (orderItems.length === 0) {
                    alert('订单数据过期，请重新选择！');
                    window.location.href = 'cart.html';
                    return;
                }
                renderOrderItems();
                calculateAndRenderTotal();
            } catch (e) {
                window.location.href = 'cart.html';
            }
        });

        // --- 渲染商品清单 ---
        function renderOrderItems() {
            const container = document.getElementById('order-items-container');
            let html = '';

            orderItems.forEach(item => {
                html += `
                <div class="flex items-start gap-3 w-full">
                    <div class="w-[85px] h-[85px] rounded-[16px] overflow-hidden shrink-0 bg-gray-50 border border-gray-100">
                        <img src="${item.image}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex flex-col justify-between h-[85px] flex-1 py-0.5">
                        <div class="flex flex-col">
                            <span class="text-[15px] font-bold text-gray-900 leading-tight">${item.name}</span>
                            <span class="text-[11px] text-gray-400 mt-1">属性：${item.attr}</span>
                        </div>
                        <div class="flex items-end justify-between mt-auto">
                            <div class="font-bold text-[#F1C84B] leading-none mb-0.5">
                                <span class="text-[11px]">￥</span><span class="text-[16px]">${parseFloat(item.price).toFixed(1)}</span>
                            </div>
                            <span class="text-[13px] font-bold text-gray-500">×${item.quantity}</span>
                        </div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- A. 炫技级：防精度丢失计算 ---
        function calculateAndRenderTotal() {
            let totalCents = 0; 
            orderItems.forEach(item => {
                // 乘100变整数计算，彻底杜绝 js 浮点数精度 bug
                const priceInCents = Math.round(parseFloat(item.price) * 100);
                totalCents += priceInCents * item.quantity;
            });
            const totalStr = (totalCents / 100).toFixed(1); // 按照设计图要求保留1位小数体验
            document.getElementById('total-price').textContent = totalStr;
        }

        // --- C. 核心修改：状态清理与携参跳转闭环 ---
        function processPayment() {
            const totalStr = document.getElementById('total-price').textContent;

            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave-left');
            setTimeout(() => {
                window.location.href = `payment.html?amount=${totalStr}`;
            }, 300);
        }

        // --- 路由：取消支付返回 ---
        function handleBack() {
            const main = document.getElementById('app-main');
            main.classList.remove('page-enter');
            main.classList.add('page-leave-right');
            setTimeout(() => {
                window.location.href = 'cart.html';
            }, 300); 
        }
    </script>
</body>
</html>
